<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f5f5;
        color: #333;
      }
      h1 {
        font-size: 2em;
        margin-bottom: 1.2rem;
        color: #222;
      }

      /* Role colours */
      .name-role-general {
        color: #2e7d32;
      }
      .name-role-classrep {
        color: #c77800;
      }
      .name-role-steeringcommittee {
        color: #1565c0;
      }
      .name-role-orgcommittee {
        color: #6a1b9a;
      }
      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1000;
      }
      .modal-overlay.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal {
        background: white;
        border-radius: 12px;
        padding: 24px;
        width: 90%;
        max-width: 380px;
      }
      .modal-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .modal-subtitle {
        font-size: 12px;
        color: #888;
        margin-bottom: 16px;
      }

      .role-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .role-btn {
        padding: 10px 14px;
        border-radius: 8px;
        border: 2px solid transparent;
        cursor: pointer;
        text-align: left;
        font-size: 13px;
        font-weight: 500;
        transition: opacity 0.15s;
      }
      .role-btn:hover {
        opacity: 0.85;
      }
      .role-btn.selected {
        border-color: #333;
      }
      .role-btn-full {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .role-btn-general {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .role-btn-classrep {
        background: #fff8e1;
        color: #f57f17;
      }
      .role-btn-steeringcommittee {
        background: #e3f2fd;
        color: #1565c0;
      }
      .role-btn-orgcommittee {
        background: #f3e5f5;
        color: #6a1b9a;
      }
      .role-btn-label {
        font-size: 13px;
        font-weight: 600;
      }
      .role-btn-count {
        font-size: 11px;
        font-weight: 400;
        margin-top: 1px;
        opacity: 0.8;
      }

      .modal-form {
        display: none;
      }
      .modal-form.visible {
        display: block;
      }
      .modal input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid #ddd;
        border-radius: 7px;
        margin-bottom: 10px;
        outline: none;
      }
      .modal input:focus {
        border-color: #4caf50;
      }
      .modal-submit {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        margin-top: 4px;
      }
      .modal-submit:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .modal-submit-general {
        background: #4caf50;
      }
      .modal-submit-classrep {
        background: #ffa000;
      }
      .modal-submit-steeringcommittee {
        background: #1976d2;
      }
      .modal-submit-orgcommittee {
        background: #7b1fa2;
      }
      .modal-cancel {
        width: 100%;
        padding: 9px;
        font-size: 13px;
        color: #888;
        background: none;
        border: none;
        cursor: pointer;
        margin-top: 6px;
      }
      .modal-message {
        font-size: 13px;
        padding: 8px 10px;
        border-radius: 6px;
        margin-top: 8px;
        line-height: 1.5;
      }
      .modal-message.success {
        background: #e8f5e9;
        color: #2e7d32;
      }
      .modal-message.error {
        background: #fdecea;
        color: #d32f2f;
        font-weight: 500;
      }
      .modal-message.action-needed {
        background: #fff8e1;
        color: #7a5200;
        font-weight: 600;
      }
      .modal-message-main {
        display: block;
      }
      .modal-message-emphasis {
        display: block;
        margin-top: 6px;
        padding: 0;
        color: #7a5200;
        font-weight: 700;
      }
      .modal-helper {
        font-size: 19px;
        color: #666;
        margin: 10px 0 8px;
        line-height: 1.5;
      }

      .names-section {
        margin-bottom: 14px;
      }
      .names-role-group {
        margin-bottom: 8px;
      }
      .names-role-label {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .names-role-label-general {
        color: #2e7d32;
      }
      .names-role-label-classrep {
        color: #f57f17;
      }
      .names-role-label-steeringcommittee {
        color: #1565c0;
      }
      .names-role-label-orgcommittee {
        color: #6a1b9a;
      }
      .names-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .name-chip {
        font-size: 11px;
        padding: 3px 9px;
        background: #f0f0f0;
        border-radius: 20px;
        color: #444;
      }
      .name-chip.name-role-general {
        background: #edf7ee;
        color: #2e7d32;
      }
      .name-chip.name-role-classrep {
        background: #fff6df;
        color: #c77800;
      }
      .name-chip.name-role-steeringcommittee {
        background: #eaf3ff;
        color: #1565c0;
      }
      .name-chip.name-role-orgcommittee {
        background: #f4eafd;
        color: #6a1b9a;
      }
      .name-chip-class {
        color: #888;
        /* TEXT_SIZE: [POP-UP] Desktop class text inside name chips */
        font-size: 11px;
      }
      .modal-full-message {
        /* TEXT_SIZE: [POP-UP] Desktop full-capacity message */
        font-size: 17px;
        color: #999;
        text-align: center;
        padding: 8px 0;
        line-height: 1.5;
      }
      .mobile-slot-names {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.5;
      }
      .mobile-slot-name-group {
        margin-top: 4px;
      }
      .mobile-slot-name-group:first-child {
        margin-top: 0;
      }
      .mobile-slot-role-label {
        display: inline-block;
        margin-right: 6px;
        font-weight: 700;
      }
      .mobile-slot-name-list {
        font-weight: 600;
      }
      /* Cancel tab */
      .modal-tabs {
        display: flex;
        border-bottom: 2px solid #e0e0e0;
        margin-bottom: 14px;
      }
      .modal-tab {
        flex: 1;
        padding: 8px;
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        color: #aaa;
        background: none;
        border-top: none;
        border-left: none;
        border-right: none;
      }
      .modal-tab.active-signup {
        color: #2e7d32;
        border-bottom-color: #2e7d32;
      }
      .modal-tab.active-cancel {
        color: #c62828;
        border-bottom-color: #c62828;
      }

      .cancel-form {
        display: none;
      }
      .cancel-form.visible {
        display: block;
      }
      .cancel-helper {
        margin-bottom: 8px;
        color: #666;
        font-size: 14px;
        line-height: 1.5;
      }
      .cancel-signup-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-height: 260px;
        padding: 2px 6px 2px 2px;
        margin-bottom: 10px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .cancel-signup-option {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
        background-clip: padding-box;
        color: #333;
        cursor: pointer;
        overflow: hidden;
        text-align: left;
        touch-action: manipulation;
        transition:
          background-color 0.1s ease,
          border-color 0.1s ease,
          box-shadow 0.1s ease;
        white-space: normal;
        -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) and (pointer: fine) {
        .cancel-signup-option:hover {
          border-color: #c62828;
          background: #fff8f7;
        }
      }
      .cancel-signup-option:active {
        border-color: #c62828;
        background: #fff8f7;
      }
      .cancel-signup-option:focus-visible {
        outline: 2px solid #c62828;
        outline-offset: -2px;
      }
      .cancel-signup-option:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      .cancel-signup-option.selected {
        border-color: #c62828;
        background: #fdecea;
        box-shadow: inset 0 0 0 1px #c62828;
      }
      .cancel-signup-name {
        display: block;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .cancel-signup-details {
        display: block;
        margin-top: 2px;
        color: #666;
        font-size: 12px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .cancel-submit {
        width: 100%;
        padding: 11px;
        font-size: 16px;
        font-weight: 600;
        background: #c62828;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        margin-top: 4px;
      }
      .cancel-submit:disabled {
        background: #aaa;
        cursor: not-allowed;
      }

      /* Confirmation prompt */
      .confirm-box {
        background: #fdecea;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 13px;
        color: #c62828;
        line-height: 1.5;
      }
      #confirmText {
        text-align: center;
      }
      .confirm-question {
        margin-bottom: 10px;
        font-size: 16px;
        font-weight: 700;
      }
      .confirm-signup-summary {
        padding: 12px;
        border: 2px solid #c62828;
        border-radius: 8px;
        background: white;
        overflow: hidden;
        text-align: center;
      }
      .confirm-signup-name {
        display: block;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .confirm-signup-details {
        display: block;
        margin-top: 5px;
        font-size: 16px;
        font-weight: 800;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .confirm-buttons {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .confirm-yes {
        flex: 1;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        background: #c62828;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
      }
      .confirm-no {
        flex: 1;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        background: #f0f0f0;
        color: #333;
        border: none;
        border-radius: 7px;
        cursor: pointer;
      }
      .confirm-yes:disabled {
        background: #aaa;
        cursor: not-allowed;
        opacity: 0.6;
      }
      .confirm-no:disabled {
        background: #ccc;
        color: #999;
        cursor: not-allowed;
        opacity: 0.6;
      }

      /* Mobile agenda */
      .mobile-agenda {
        display: none;
        padding-bottom: 24px;
      }

      .mobile-time-group {
        margin-bottom: 24px;
      }

      .mobile-time-heading {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #2b2b2b;
        line-height: 1.35;
      }

      .mobile-slot-card {
        width: 100%;
        display: block;
        text-align: left;
        border: 1px solid #d9dee3;
        border-radius: 16px;
        background: #ffffff;
        padding: 18px 18px 16px;
        margin-bottom: 12px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        transition:
          transform 0.08s ease,
          box-shadow 0.12s ease;
      }

      .mobile-slot-card:active {
        transform: scale(0.992);
      }

      .mobile-slot-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .mobile-slot-title {
        font-size: 19px;
        font-weight: 700;
        color: #222;
        line-height: 1.3;
        margin-bottom: 6px;
      }

      .mobile-slot-meta {
        font-size: 15px;
        color: #6b7280;
        line-height: 1.45;
      }

    /* TEXT_SIZE: [SIGN-UP CARD] Mobile description display (e.g. "opening ceremony") */
      .mobile-slot-desc {
        font-size: 25px;
        color: #666;
        margin-top: 8px;
        line-height: 1.5;
      }
      /*
      .mobile-slot-badge {
        flex-shrink: 0;
        font-size: 14px;
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 14px;
        white-space: nowrap;
        background: #16a34a;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(234, 182, 60, 0.2);
      }
*/
      .mobile-slot-badge.is-full {
        background: #d64545;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(214, 69, 69, 0.2);
      }

      /* --- Role-count summary line shown only in compact mode --- */
      .mobile-slot-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-top: 10px;
      }
      .mobile-slot-summary-item {
        font-size: 13px;
        font-weight: 600;
      }
      .mobile-slot-summary-item.role-general {
        color: #2e7d32;
      }
      .mobile-slot-summary-item.role-classrep {
        color: #b26a00;
      }
      .mobile-slot-summary-item.role-steeringcommittee {
        color: #1565c0;
      }
      .mobile-slot-summary-item.role-orgcommittee {
        color: #6a1b9a;
      }
      .mobile-slot-summary-item.is-full {
        color: #aaa;
      }

      /* ===== Compact / mobile layout (<=900px) ===== */

      body.compact-layout {
        padding: 12px;
        font-size: 16px;
      }

      body.compact-layout h1 {
        font-size: 32px;
        line-height: 1.25;
        margin-bottom: 16px;
      }

      .mobile-display-mode-control {
        display: none;
      }

      .mobile-availability-control {
        display: none;
      }

      body.compact-layout .mobile-availability-control {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        gap: 10px;
        margin: -8px 14px 14px;
        padding: 9px 10px 10px;
        isolation: isolate;
        background: #faf8f5;
        border: 1px solid #ede6dc;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(26, 26, 24, 0.05);
      }

      body.compact-layout .mobile-availability-control::before {
        content: "";
        position: absolute;
        top: -12px;
        right: -14px;
        bottom: -18px;
        left: -14px;
        z-index: -1;
        background: #f5f2ee;
        pointer-events: none;
      }

      .mobile-filter-row {
        display: grid;
        gap: 8px;
        align-items: end;
      }

      .mobile-filter-row-secondary {
        grid-template-columns: 1fr;
      }

      .mobile-filter-field {
        display: block;
        min-width: 0;
      }

      .mobile-filter-label {
        display: block;
        margin: 0 0 6px;
        color: #766d63;
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
      }

      .mobile-filter-select,
      .mobile-keyword-search {
        min-width: 0;
        min-height: 40px;
        width: 100%;
        padding: 6px 34px 6px 12px;
        border: 1px solid #e2dbd2;
        border-radius: 9px;
        background: #fbfaf7;
        color: #514940;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.2;
      }

      .mobile-keyword-search {
        padding-right: 12px;
      }

      .mobile-activity-filter-pills,
      .mobile-role-filter-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .mobile-activity-filter-pill,
      .mobile-role-filter-pill {
        min-height: 54px;
        padding: 13px 18px;
        border: 1px solid #e2dbd2;
        border-radius: 999px;
        background: #f8f6f2;
        color: #60584f;
        cursor: pointer;
        font-size: 23px;
        font-weight: 800;
        line-height: 1.15;
      }

      body.compact-layout .mobile-availability-control.is-signup-mode
        .mobile-activity-filter-field {
        order: 1;
      }

      body.compact-layout .mobile-availability-control.is-signup-mode
        .mobile-role-filter-field {
        order: 2;
      }

      body.compact-layout .mobile-availability-control.is-signup-mode
        .mobile-time-filter-field {
        order: 3;
      }

      body.compact-layout .mobile-availability-control.is-signup-mode
        .mobile-keyword-filter-field {
        order: 4;
      }

      body.compact-layout .mobile-availability-control.is-signup-mode
        .mobile-time-availability-detail {
        order: 5;
      }

      body.compact-layout .mobile-availability-control.is-overview-mode
        .mobile-role-filter-field,
      body.compact-layout .mobile-availability-control.is-overview-mode
        .mobile-time-filter-field,
      body.compact-layout .mobile-availability-control.is-overview-mode
        .mobile-keyword-filter-field,
      body.compact-layout .mobile-availability-control.is-overview-mode
        .mobile-time-availability-detail {
        display: none;
      }

      .mobile-activity-filter-pill {
        border-radius: 8px;
        background: #f8f6f2;
        color: #60584f;
      }

      .mobile-activity-filter-pill.is-active {
        border-color: #8f6b2f;
        background: #5b4630;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(91, 70, 48, 0.16);
      }

      .mobile-activity-filter-pill.activity-accent-0.is-active {
        border-color: #a74722;
        background: #b94f25;
        box-shadow: 0 2px 8px rgba(185, 79, 37, 0.18);
      }

      .mobile-activity-filter-pill.activity-accent-1.is-active {
        border-color: #245e73;
        background: #2b6f85;
        box-shadow: 0 2px 8px rgba(43, 111, 133, 0.18);
      }

      .mobile-activity-filter-pill.activity-accent-2.is-active {
        border-color: #59663a;
        background: #687541;
        box-shadow: 0 2px 8px rgba(104, 117, 65, 0.18);
      }

      .mobile-activity-filter-pill.activity-accent-3.is-active {
        border-color: #9b6f1f;
        background: #ad7d25;
        box-shadow: 0 2px 8px rgba(173, 125, 37, 0.18);
      }

      .mobile-activity-filter-pill.activity-accent-4.is-active {
        border-color: #68436d;
        background: #75507a;
        box-shadow: 0 2px 8px rgba(117, 80, 122, 0.18);
      }

      .mobile-activity-filter-pill.activity-accent-5.is-active {
        border-color: #8a3329;
        background: #9d3e32;
        box-shadow: 0 2px 8px rgba(157, 62, 50, 0.18);
      }

      .mobile-role-filter-pill.is-active {
        border-color: #3f3a35;
        background: #3f3a35;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(63, 58, 53, 0.16);
      }

      .mobile-role-filter-pill.role-general.is-active {
        border-color: #1f6b2b;
        background: #267a32;
        box-shadow: 0 2px 8px rgba(38, 122, 50, 0.18);
      }

      .mobile-role-filter-pill.role-classrep.is-active {
        border-color: #9a5a00;
        background: #b26a00;
        box-shadow: 0 2px 8px rgba(178, 106, 0, 0.18);
      }

      .mobile-role-filter-pill.role-steeringcommittee.is-active {
        border-color: #0f4f9a;
        background: #155fae;
        box-shadow: 0 2px 8px rgba(21, 95, 174, 0.18);
      }

      .mobile-role-filter-pill.role-orgcommittee.is-active {
        border-color: #56137c;
        background: #681c8d;
        box-shadow: 0 2px 8px rgba(104, 28, 141, 0.18);
      }

      .mobile-role-filter-pill.role-general:not(.is-active) {
        border-color: #e2dbd2;
        background: #f8f6f2;
        color: #60584f;
      }

      .mobile-role-filter-pill.role-classrep:not(.is-active) {
        border-color: #e2dbd2;
        background: #f8f6f2;
        color: #60584f;
      }

      .mobile-role-filter-pill.role-steeringcommittee:not(.is-active) {
        border-color: #e2dbd2;
        background: #f8f6f2;
        color: #60584f;
      }

      .mobile-role-filter-pill.role-orgcommittee:not(.is-active) {
        border-color: #e2dbd2;
        background: #f8f6f2;
        color: #60584f;
      }

      .mobile-time-filter-dropdown {
        position: relative;
      }

      .mobile-time-filter-field .mobile-filter-label {
        font-size: 18px;
      }

      .mobile-time-filter-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 50px;
        padding: 10px 34px 10px 14px;
        text-align: left;
        border-color: #e2dbd2;
        background: #fbfaf7;
        color: #514940;
        cursor: pointer;
        font-size: 18px;
        line-height: 1.2;
      }

      .mobile-time-filter-toggle::after {
        content: "▾";
        flex-shrink: 0;
        color: #8a8176;
        font-size: 15px;
        line-height: 1;
      }

      .mobile-time-filter-toggle.is-open::after {
        content: "▴";
      }

      .mobile-time-filter-toggle:disabled {

    <script>
      function b64decode(str) {
        return decodeURIComponent(
          atob(str)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join(""),
        );
      }

      var EXEC_URL = "";
      var PAGE_LOAD_TIME = Date.now();
      var SIGNUP_BTN_TEXT = "登録する";
      var gridData = JSON.parse(b64decode("<?!= gridData ?>"));
      var alias = b64decode("<?!= alias ?>");
      var ROLES = JSON.parse(b64decode("<?!= roles ?>"));
      var PAGE_TITLE = b64decode("<?!= title ?>");
      var currentEventId = null;
      var currentRole = null;
      var currentCancelSignup = null;
      var currentCancelOption = null;
      var resizeTimer = null;
      var MOBILE_DISPLAY_MODE_STORAGE_KEY = "signupApp.mobileDisplayMode";
      var DEFAULT_MOBILE_DISPLAY_MODE = "signup";
      var MOBILE_TIME_FILTER_ALL = "__all__";
      var MOBILE_ROLE_FILTER_ALL = "__all__";
      var MOBILE_ACTIVITY_FILTER_ALL = "__all__";
      var mobileAvailableTimeFilter = [];
      var mobileRoleAvailabilityFilter = MOBILE_ROLE_FILTER_ALL;
      var mobileActivityFilter = MOBILE_ACTIVITY_FILTER_ALL;
      var mobileKeywordSearchQuery = "";
      var mobileTimeFilterDropdownOpen = false;
      var activeDesktopInsightView = null;

      var ROLE_KEYS = [
        {
          key: "general",
          classSuffix: "general",
          label: ROLES.general,
          btnClass: "role-btn-general",
          labelClass: "names-role-label-general",
          nameClass: "name-role-general",
        },
        {
          key: "classRep",
          classSuffix: "classrep",
          label: ROLES.classRep,
          btnClass: "role-btn-classrep",
          labelClass: "names-role-label-classrep",
          nameClass: "name-role-classrep",
        },
        {
          key: "steeringCommittee",
          classSuffix: "steeringcommittee",
          label: ROLES.steeringCommittee,
          btnClass: "role-btn-steeringcommittee",
          labelClass: "names-role-label-steeringcommittee",
          nameClass: "name-role-steeringcommittee",
        },
        {
          key: "orgCommittee",
          classSuffix: "orgcommittee",
          label: ROLES.orgCommittee,
          btnClass: "role-btn-orgcommittee",
          labelClass: "names-role-label-orgcommittee",
          nameClass: "name-role-orgcommittee",
        },
      ];

      var ROLE_META_BY_LABEL = ROLE_KEYS.reduce(function (acc, roleMeta) {
        acc[roleMeta.label] = roleMeta;
        return acc;
      }, {});
      var gridIndexes = null;
      var mobileDisplayMode = getStoredMobileDisplayMode();

      function getActivityAccentClass(activity) {
        var activities = (gridData && gridData.activities) || [];
        var activityIndex = activities.indexOf(activity);
        if (activityIndex < 0) activityIndex = 0;
        return "activity-accent-" + (activityIndex % 6);
      }

      function normaliseMobileDisplayMode(mode) {
        if (mode === "signup" || mode === "overview") return mode;
        if (mode === "time") return "signup";
        if (mode === "activity") return "overview";
        return DEFAULT_MOBILE_DISPLAY_MODE;
      }

      function getStoredMobileDisplayMode() {
        try {
          if (window.localStorage) {
            return normaliseMobileDisplayMode(
              window.localStorage.getItem(MOBILE_DISPLAY_MODE_STORAGE_KEY),
            );
          }
        } catch (e) {}
        return DEFAULT_MOBILE_DISPLAY_MODE;
      }

      function saveMobileDisplayMode(mode) {
        try {
          if (window.localStorage) {
            window.localStorage.setItem(
              MOBILE_DISPLAY_MODE_STORAGE_KEY,
              normaliseMobileDisplayMode(mode),
            );
          }
        } catch (e) {}
      }

      function getMobileDisplayMode() {
        return normaliseMobileDisplayMode(mobileDisplayMode);
      }

      function updateMobileDisplayModeControl() {
        var activeMode = getMobileDisplayMode();
        [
          { id: "mobileDisplayModeTime", mode: "signup" },
          { id: "mobileDisplayModeActivity", mode: "overview" },
        ].forEach(function (item) {
          var btn = document.getElementById(item.id);
          if (!btn) return;
          var active = item.mode === activeMode;
          if (btn.classList && btn.classList.toggle) {
            btn.classList.toggle("active", active);
          }
          btn.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function setMobileDisplayMode(mode) {
        var nextMode = normaliseMobileDisplayMode(mode);
        if (mobileDisplayMode === nextMode) {
          updateMobileDisplayModeControl();
          return;
        }

        mobileDisplayMode = nextMode;
        saveMobileDisplayMode(nextMode);
        updateMobileDisplayModeControl();
        buildMobileAgenda();
      }

      function clearElement(element) {
        while (element && element.firstChild) {
          element.removeChild(element.firstChild);
        }
      }

      function buildGridIndexes() {
        var events = (gridData && gridData.events) || [];
        var indexes = {
          eventById: Object.create(null),
        };

        events.forEach(function (event) {
          indexes.eventById[String(event.eventId)] = event;

          event.signupsByRole = ROLE_KEYS.reduce(function (roleMap, roleMeta) {
            roleMap[roleMeta.label] = [];
            return roleMap;
          }, {});

          (event.signups || []).forEach(function (signup) {
            if (!event.signupsByRole[signup.role]) {
              event.signupsByRole[signup.role] = [];
            }
            event.signupsByRole[signup.role].push(signup);
          });
        });

        gridIndexes = indexes;
      }

      function compareEventsByTime(a, b) {
        var startA = String((a && a.startTime) || "");
        var startB = String((b && b.startTime) || "");
        if (startA !== startB) return startA < startB ? -1 : 1;

        var endA = String((a && a.endTime) || "");
        var endB = String((b && b.endTime) || "");
        if (endA !== endB) return endA < endB ? -1 : 1;

        return String((a && a.eventId) || "").localeCompare(
          String((b && b.eventId) || ""),
        );
      }

      function getEventById(eventId) {
        return gridIndexes && gridIndexes.eventById[String(eventId)];
      }

      function getRoleMetaByLabel(roleLabel) {
        return ROLE_META_BY_LABEL[roleLabel] || null;
      }

      function getEffectiveWidth() {
        var widths = [];

        if (window.visualViewport && window.visualViewport.width) {
          widths.push(window.visualViewport.width);
        }

        if (window.screen && window.screen.width) {
          widths.push(window.screen.width);
        }

        if (document.documentElement && document.documentElement.clientWidth) {
          widths.push(document.documentElement.clientWidth);
        }

        if (window.innerWidth) {
          widths.push(window.innerWidth);
        }

        widths = widths.filter(function (w) {
          return typeof w === "number" && w > 0;
        });

        if (!widths.length) return window.innerWidth || 9999;

        return Math.min.apply(null, widths);
      }

      function isCompactLayout() {
        return getEffectiveWidth() <= 900;
      }

      function getMobileAgenda() {
        return document.getElementById("mobileAgenda");
      }

      function scrollDesktopAgendaIntoView() {
        var agenda = getMobileAgenda();
        if (!agenda || !agenda.scrollIntoView) return;

        var controls = document.querySelector(".schedule-controls");
        if (agenda.style && controls && controls.getBoundingClientRect) {
          var controlsRect = controls.getBoundingClientRect();
          var controlsBottom = controlsRect && controlsRect.bottom;
          if (
            typeof controlsBottom === "number" &&
            isFinite(controlsBottom)
          ) {
            agenda.style.scrollMarginTop =
              Math.ceil(Math.max(0, controlsBottom) + 16) + "px";
          }
        }

        agenda.scrollIntoView({
          behavior: "smooth",
          block: "start",
          inline: "nearest",
        });
      }

      function getMobileTimeFilterSelect() {
        return document.getElementById("mobileTimeAvailabilityFilter");
      }

      function getMobileTimeFilterToggle() {
        return document.getElementById("mobileTimeAvailabilityToggle");
      }

      function getMobileActivityFilterContainer() {
        return document.getElementById("mobileActivityFilter");
      }

      function getMobileRoleFilterSelect() {
        return document.getElementById("mobileRoleAvailabilityFilter");
      }

      function getMobileKeywordSearchInput() {
        return document.getElementById("mobileKeywordSearch");
      }

      function hasAnyAvailable(slots) {
        return ROLE_KEYS.some(function (r) {
          return slots[r.key].max > 0 && slots[r.key].filled < slots[r.key].max;
        });
      }

      function getRoleSlot(event, roleKey) {
        return event && event.slots ? event.slots[roleKey] || null : null;
      }

      function getRemainingForRole(event, roleKey) {
        var slot = getRoleSlot(event, roleKey) || {};
        var max = Number(slot.max) || 0;
        var filled = Number(slot.filled) || 0;
        return Math.max(0, max - filled);
      }

      function eventHasRoleSlot(event, roleKey) {
        var slot = getRoleSlot(event, roleKey) || {};
        return (Number(slot.max) || 0) > 0;
      }

      function eventHasAvailableRoleSlot(event, roleKey) {
        return eventHasRoleSlot(event, roleKey) && getRemainingForRole(event, roleKey) > 0;
      }

      function getAvailableSlotCount(event, roleKey) {
        if (!event || !event.slots) return 0;
        if (roleKey && roleKey !== MOBILE_ROLE_FILTER_ALL) {
          return getRemainingForRole(event, roleKey);
        }
        return ROLE_KEYS.reduce(function (total, r) {
          return total + getRemainingForRole(event, r.key);
        }, 0);
      }

      function getAvailableSlotCountForEvents(events, roleKey) {
        return (events || []).reduce(function (total, event) {
          return total + getAvailableSlotCount(event, roleKey);
        }, 0);
      }

      function getFullEventCount(events, roleKey) {
        return (events || []).filter(function (event) {
          if (roleKey && roleKey !== MOBILE_ROLE_FILTER_ALL) {
            return eventHasRoleSlot(event, roleKey) && !eventHasAvailableRoleSlot(event, roleKey);
          }
          return !hasAnyAvailable(event.slots || {});
        }).length;
      }

      function normaliseMobileRoleFilter(value) {
        if (!value || value === MOBILE_ROLE_FILTER_ALL) {
          return MOBILE_ROLE_FILTER_ALL;
        }
        var requested = String(value);
        return ROLE_KEYS.some(function (r) {
          return r.key === requested;
        })
          ? requested
          : MOBILE_ROLE_FILTER_ALL;
      }

      function getMobileRoleFilter() {
        mobileRoleAvailabilityFilter = normaliseMobileRoleFilter(
          mobileRoleAvailabilityFilter,
        );
        return mobileRoleAvailabilityFilter;
      }

      function normaliseMobileActivityFilter(value) {
        if (!value || value === MOBILE_ACTIVITY_FILTER_ALL) {
          return MOBILE_ACTIVITY_FILTER_ALL;
        }
        var requested = String(value);
        var activities = (gridData && gridData.activities) || [];
        var hasActivity = activities.indexOf(requested) !== -1;
        if (!hasActivity && gridData && gridData.events) {
          hasActivity = gridData.events.some(function (event) {
            return event.activity === requested;
          });
        }
        return hasActivity ? requested : MOBILE_ACTIVITY_FILTER_ALL;
      }

      function getMobileActivityFilter() {
        mobileActivityFilter = normaliseMobileActivityFilter(
          mobileActivityFilter,
        );
        return mobileActivityFilter;
      }

      function normaliseMobileKeywordSearchQuery(value) {
        return normaliseComparable(String(value || ""));
      }

      function getMobileKeywordSearchQuery() {
        return normaliseMobileKeywordSearchQuery(mobileKeywordSearchQuery);
      }

      function getMobileVolunteerNameQuery() {
        return getMobileKeywordSearchQuery();
      }

      function setMobileRoleFilter(roleKey) {
        mobileRoleAvailabilityFilter = normaliseMobileRoleFilter(roleKey);
        mobileAvailableTimeFilter = normaliseMobileAvailableTimeFilter(
          mobileAvailableTimeFilter,
        );
        updateMobileAvailabilityControl();
        buildMobileAgenda();
      }

      function setMobileActivityFilter(activity) {
        mobileActivityFilter = normaliseMobileActivityFilter(activity);
        mobileAvailableTimeFilter = normaliseMobileAvailableTimeFilter(
          mobileAvailableTimeFilter,
        );
        updateMobileAvailabilityControl();
        buildMobileAgenda();
      }

      function setMobileKeywordSearchQuery(value) {
        mobileKeywordSearchQuery = String(value || "");
        mobileAvailableTimeFilter = normaliseMobileAvailableTimeFilter(
          mobileAvailableTimeFilter,
        );
        updateMobileAvailabilityControl();
        buildMobileAgenda();
      }

      function setMobileVolunteerNameQuery(value) {
        setMobileKeywordSearchQuery(value);
      }

      function eventMatchesRoleFilter(event, roleKey) {
        if (!roleKey || roleKey === MOBILE_ROLE_FILTER_ALL) return true;
        return eventHasRoleSlot(event, roleKey);
      }

      function eventMatchesActivityFilter(event, activity) {
        if (!activity || activity === MOBILE_ACTIVITY_FILTER_ALL) return true;
        return event.activity === activity;
      }

      function eventMatchesTimeFilter(event, time) {
        if (Array.isArray(time)) {
          if (time.length === 0) return true;
          return time.indexOf(String(event.startTime || "")) !== -1;
        }
        if (!time || time === MOBILE_TIME_FILTER_ALL) return true;
        return String(event.startTime || "") === String(time);
      }

      function eventMatchesKeywordSearch(event, query) {
        if (!query) return true;
        var eventFields = [
          event.activity,
          event.subtitle,
          event.description,
        ];
        var matchesEventText = eventFields.some(function (value) {
          return normaliseComparable(value || "").indexOf(query) !== -1;
        });
        if (matchesEventText) return true;

        return (event.signups || []).some(function (signup) {
          return normaliseComparable(signup.name || "").indexOf(query) !== -1;
        });
      }

      function getMobileBaseFilteredEvents() {
        var roleKey = getMobileRoleFilter();
        var activity = getMobileActivityFilter();
        var keywordQuery = getMobileKeywordSearchQuery();
        return ((gridData && gridData.events) || []).filter(function (event) {
          return (
            eventMatchesRoleFilter(event, roleKey) &&
            eventMatchesActivityFilter(event, activity) &&
            eventMatchesKeywordSearch(event, keywordQuery)
          );
        });
      }

      function getMobileRoleFilterOptionEvents() {
        var activity = getMobileActivityFilter();
        var times = getMobileAvailableTimeFilters();
        var keywordQuery = getMobileKeywordSearchQuery();
        return ((gridData && gridData.events) || []).filter(function (event) {
          return (
            eventMatchesActivityFilter(event, activity) &&
            eventMatchesTimeFilter(event, times) &&
            eventMatchesKeywordSearch(event, keywordQuery)
          );
        });
      }

      function getMobileAvailableRoleOptions() {
        var events = getMobileRoleFilterOptionEvents();
        return ROLE_KEYS.filter(function (r) {
          return getAvailableSlotCountForEvents(events, r.key) > 0;
        });
      }

      function getAvailableRoleSummariesForEvents(events, roleKey) {
        return ROLE_KEYS.filter(function (r) {
          return !roleKey || roleKey === MOBILE_ROLE_FILTER_ALL || r.key === roleKey;
        })
          .map(function (r) {
            return {
              key: r.key,
              label: r.label,
              remaining: getAvailableSlotCountForEvents(events, r.key),
            };
          })
          .filter(function (summary) {
            return summary.remaining > 0;
          });
      }

      function formatRoleAvailabilitySummary(summaries) {
        if (!summaries || summaries.length === 0) {
          return "空きなし";
        }
        return summaries
          .map(function (summary) {
            return summary.label + " " + formatRemainingSlots(summary.remaining);
          })
          .join(" / ");
      }

      function getMobileAvailableTimeOptions() {
        var events = getMobileBaseFilteredEvents();
        var roleKey = getMobileRoleFilter();
        var eventGroups = Object.create(null);
        events.forEach(function (event) {
          var time = String(event.startTime || "");
          if (!time) return;
          if (!eventGroups[time]) eventGroups[time] = [];
          eventGroups[time].push(event);
        });

        var orderedTimes = (gridData && gridData.times ? gridData.times : [])
          .slice()
          .filter(function (time, index, times) {
            return times.indexOf(time) === index;
          });
        Object.keys(eventGroups)
          .sort()
          .forEach(function (time) {
            if (orderedTimes.indexOf(time) === -1) orderedTimes.push(time);
          });

        return orderedTimes
          .map(function (time) {
            var matchingEvents = eventGroups[time] || [];
            var roleSummaries = getAvailableRoleSummariesForEvents(
              matchingEvents,
              roleKey,
            );
            return {
              time: time,
              events: matchingEvents,
              availableSlots: getAvailableSlotCountForEvents(
                matchingEvents,
                roleKey,
              ),
              fullEvents: getFullEventCount(matchingEvents, roleKey),
              roleSummaries: roleSummaries,
            };
          })
          .filter(function (option) {
            return option.availableSlots > 0;
          });
      }

      function getMobileTimeOptionLabel(option) {
        var events = option.events || [];
        return getMobileTimeHeadingText(option.time, events);
      }

      function getMobileSelectedTimeLabel(selectedTimes, options) {
        if (!options || options.length === 0) return "空き時間なし";
        if (!selectedTimes || selectedTimes.length === 0) {
          return "すべての時間帯";
        }
        if (selectedTimes.length === 1) {
          var selectedOption = options.find(function (option) {
            return String(option.time) === selectedTimes[0];
          });
          return selectedOption
            ? getMobileTimeOptionLabel(selectedOption)
            : "すべての時間帯";
        }
        return selectedTimes.length + "つの時間帯を選択中";
      }

      function setMobileTimeFilterDropdownOpen(open) {
        mobileTimeFilterDropdownOpen = !!open;
        updateMobileAvailabilityControl();
      }

      function normaliseMobileAvailableTimeFilter(value) {
        var requestedValues = [];
        if (Array.isArray(value)) {
          requestedValues = value;
        } else if (value && value !== MOBILE_TIME_FILTER_ALL) {
          requestedValues = [value];
        }
        var availableTimes = getMobileAvailableTimeOptions().map(function (option) {
          return String(option.time);
        });
        var selected = [];
        requestedValues.forEach(function (item) {
          var requested = String(item);
          if (
            availableTimes.indexOf(requested) !== -1 &&
            selected.indexOf(requested) === -1
          ) {
            selected.push(requested);
          }
        });
        return selected;
      }

      function getMobileAvailableTimeFilters() {
        mobileAvailableTimeFilter = normaliseMobileAvailableTimeFilter(
          mobileAvailableTimeFilter,
        );
        return mobileAvailableTimeFilter.slice();
      }

      function getMobileAvailableTimeFilter() {
        return getMobileAvailableTimeFilters();
      }

      function setMobileAvailableTimeFilter(time) {
        if (Array.isArray(time)) {
          mobileAvailableTimeFilter = normaliseMobileAvailableTimeFilter(time);
        } else {
          var requested = String(time || "");
          if (!requested || requested === MOBILE_TIME_FILTER_ALL) {
            mobileAvailableTimeFilter = [];
          } else {
            var selectedTimes = getMobileAvailableTimeFilters();
            var selectedIndex = selectedTimes.indexOf(requested);
            if (selectedIndex === -1) {
              selectedTimes.push(requested);
            } else {
              selectedTimes.splice(selectedIndex, 1);
            }
            mobileAvailableTimeFilter =
              normaliseMobileAvailableTimeFilter(selectedTimes);
          }
        }
        updateMobileAvailabilityControl();
        buildMobileAgenda();
      }

      function getMobileFilteredEvents() {
        var events = getMobileBaseFilteredEvents();
        var selectedTimes = getMobileAvailableTimeFilters();
        if (selectedTimes.length === 0) return events;
        return events.filter(function (event) {
          return selectedTimes.indexOf(String(event.startTime || "")) !== -1;
        });
      }

      function getOrderedValuesForEvents(events, key, preferredOrder) {
        var values = [];
        var seen = Object.create(null);
        (preferredOrder || []).forEach(function (value) {
          var hasMatchingEvent = events.some(function (event) {
            return event[key] === value;
          });
          if (hasMatchingEvent && !seen[value]) {
            seen[value] = true;
            values.push(value);
          }
        });
        events.forEach(function (event) {
          var value = event[key];
          if (value && !seen[value]) {
            seen[value] = true;
            values.push(value);
          }
        });
        return values;
      }

      function getMobileFilteredTimes(events) {
        return getOrderedValuesForEvents(
          events,
          "startTime",
          (gridData && gridData.times) || [],
        );
      }

      function getMobileFilteredActivities(events) {
        return getOrderedValuesForEvents(
          events,
          "activity",
          (gridData && gridData.activities) || [],
        );
      }

      function updateMobileAvailabilityControl() {
        var timeFilter = getMobileTimeFilterSelect();
        var timeToggle = getMobileTimeFilterToggle();
        var activityFilter = getMobileActivityFilterContainer();
        var roleFilter = getMobileRoleFilterSelect();
        var keywordInput = getMobileKeywordSearchInput();
        var timeDetail = document.getElementById("mobileTimeAvailabilityDetail");
        var activity = getMobileActivityFilter();
        var roleKey = getMobileRoleFilter();
        var options = getMobileAvailableTimeOptions();
        var selectedTimes = getMobileAvailableTimeFilters();
        var availableRoleOptions = getMobileAvailableRoleOptions();

        if (
          roleKey !== MOBILE_ROLE_FILTER_ALL &&
          !availableRoleOptions.some(function (r) {
            return r.key === roleKey;
          })
        ) {
          mobileRoleAvailabilityFilter = MOBILE_ROLE_FILTER_ALL;
          roleKey = MOBILE_ROLE_FILTER_ALL;
          options = getMobileAvailableTimeOptions();
          selectedTimes = getMobileAvailableTimeFilters();
          availableRoleOptions = getMobileAvailableRoleOptions();
        }

        if (timeToggle) {
          if (options.length === 0) {
            mobileTimeFilterDropdownOpen = false;
          }
          timeToggle.className =
            "mobile-filter-select mobile-time-filter-toggle" +
            (mobileTimeFilterDropdownOpen ? " is-open" : "");
          timeToggle.textContent = getMobileSelectedTimeLabel(
            selectedTimes,
            options,
          );
          timeToggle.disabled = options.length === 0;
          timeToggle.setAttribute(
            "aria-expanded",
            mobileTimeFilterDropdownOpen ? "true" : "false",
          );
        }

        if (timeFilter) {
          while (timeFilter.firstChild) {
            timeFilter.removeChild(timeFilter.firstChild);
          }
          timeFilter.hidden = !mobileTimeFilterDropdownOpen || options.length === 0;

          var allTimeButton = document.createElement("button");
          allTimeButton.type = "button";
          allTimeButton.className =
            "mobile-time-filter-option" +
            (selectedTimes.length === 0 ? " is-active" : "");
          allTimeButton.setAttribute(
            "data-mobile-time-filter",
            MOBILE_TIME_FILTER_ALL,
          );
          allTimeButton.setAttribute(
            "aria-pressed",
            selectedTimes.length === 0 ? "true" : "false",
          );
          var allTimeCheck = document.createElement("span");
          allTimeCheck.className = "mobile-time-filter-check";
          allTimeCheck.textContent = selectedTimes.length === 0 ? "✓" : "";
          allTimeButton.appendChild(allTimeCheck);

          var allTimeLabel = document.createElement("span");
          allTimeLabel.className = "mobile-time-filter-option-label";
          allTimeLabel.textContent = "すべての時間帯";
          allTimeButton.appendChild(allTimeLabel);
          timeFilter.appendChild(allTimeButton);

          options.forEach(function (option) {
            var active = selectedTimes.indexOf(String(option.time)) !== -1;
            var timeButton = document.createElement("button");
            timeButton.type = "button";
            timeButton.className =
              "mobile-time-filter-option" + (active ? " is-active" : "");
            timeButton.setAttribute("data-mobile-time-filter", option.time);
            timeButton.setAttribute("aria-pressed", active ? "true" : "false");
            var timeCheck = document.createElement("span");
            timeCheck.className = "mobile-time-filter-check";
            timeCheck.textContent = active ? "✓" : "";
            timeButton.appendChild(timeCheck);

            var timeLabel = document.createElement("span");
            timeLabel.className = "mobile-time-filter-option-label";
            timeLabel.textContent = getMobileTimeOptionLabel(option);
            timeButton.appendChild(timeLabel);
            timeFilter.appendChild(timeButton);
          });
        }

        if (activityFilter) {
          while (activityFilter.firstChild) {
            activityFilter.removeChild(activityFilter.firstChild);
          }

          var allActivityButton = document.createElement("button");
          allActivityButton.type = "button";
          allActivityButton.className =
            "mobile-activity-filter-pill" +
            (activity === MOBILE_ACTIVITY_FILTER_ALL ? " is-active" : "");
          allActivityButton.setAttribute(
            "data-mobile-activity-filter",
            MOBILE_ACTIVITY_FILTER_ALL,
          );
          allActivityButton.setAttribute(
            "aria-pressed",
            activity === MOBILE_ACTIVITY_FILTER_ALL ? "true" : "false",
          );
          allActivityButton.textContent =
            "すべての募集枠";
          activityFilter.appendChild(allActivityButton);

          ((gridData && gridData.activities) || []).forEach(function (item) {
            var activityButton = document.createElement("button");
            var active = activity === item;
            activityButton.type = "button";
            activityButton.className =
              "mobile-activity-filter-pill " +
              getActivityAccentClass(item) +
              (active ? " is-active" : "");
            activityButton.setAttribute("data-mobile-activity-filter", item);
            activityButton.setAttribute("aria-pressed", active ? "true" : "false");
            activityButton.textContent = item;
            activityFilter.appendChild(activityButton);
          });
        }

        if (roleFilter) {
          while (roleFilter.firstChild) {
            roleFilter.removeChild(roleFilter.firstChild);
          }

          var allRoleButton = document.createElement("button");
          allRoleButton.type = "button";
          allRoleButton.className =
            "mobile-role-filter-pill" +
            (roleKey === MOBILE_ROLE_FILTER_ALL ? " is-active" : "");
          allRoleButton.setAttribute("data-mobile-role-filter", MOBILE_ROLE_FILTER_ALL);
          allRoleButton.setAttribute(
            "aria-pressed",
            roleKey === MOBILE_ROLE_FILTER_ALL ? "true" : "false",
          );
          allRoleButton.textContent =
            "すべてのポジション";
          roleFilter.appendChild(allRoleButton);

          availableRoleOptions.forEach(function (r) {
            var roleButton = document.createElement("button");
            var active = roleKey === r.key;
            roleButton.type = "button";
            roleButton.className =
              "mobile-role-filter-pill role-" +
              r.classSuffix +
              (active ? " is-active" : "");
            roleButton.setAttribute("data-mobile-role-filter", r.key);
            roleButton.setAttribute("aria-pressed", active ? "true" : "false");
            roleButton.textContent = r.label;
            roleFilter.appendChild(roleButton);
          });
        }

        if (keywordInput && keywordInput.value !== mobileKeywordSearchQuery) {
          keywordInput.value = mobileKeywordSearchQuery;
        }

        var selectedOptions = options.filter(function (option) {
          return selectedTimes.indexOf(String(option.time)) !== -1;
        });
        if (timeDetail) {
          if (selectedOptions.length === 1) {
            timeDetail.textContent =
              "この時間の空き: " +
              formatRoleAvailabilitySummary(selectedOptions[0].roleSummaries);
          } else if (selectedOptions.length > 1) {
            var selectedEvents = [];
            selectedOptions.forEach(function (option) {
              selectedEvents = selectedEvents.concat(option.events || []);
            });
            timeDetail.textContent =
              selectedOptions.length +
              "つの時間帯の空き: " +
              formatRoleAvailabilitySummary(
                getAvailableRoleSummariesForEvents(selectedEvents, roleKey),
              );
          } else if (options.length > 0) {
            timeDetail.textContent = "すべての空き時間帯を表示中";
          } else {
            timeDetail.textContent =
              "条件に合う空き時間帯はありません";
          }
        }
      }

      function updateDesktopScheduleSummary() {
        var availableCount = 0;
        var openRoleCount = 0;
        var signupCount = 0;

        ((gridData && gridData.events) || []).forEach(function (event) {
          signupCount += (event.signups || []).length;
          ROLE_KEYS.forEach(function (roleMeta) {
            var slot = (event.slots && event.slots[roleMeta.key]) || {};
            var remaining = Math.max(
              0,
              Number(slot.max || 0) - Number(slot.filled || 0),
            );
            availableCount += remaining;
            if (remaining > 0) openRoleCount += 1;
          });
        });

        var availableNode = document.getElementById("desktopAvailableCount");
        var openRoleNode = document.getElementById("desktopOpenRoleCount");
        var signupNode = document.getElementById("desktopSignupCount");
        if (availableNode) availableNode.textContent = availableCount;
        if (openRoleNode) openRoleNode.textContent = openRoleCount;
        if (signupNode) signupNode.textContent = signupCount;

        var panel = document.getElementById("desktopInsightsPanel");
        if (
          activeDesktopInsightView &&
          panel &&
          !panel.hidden
        ) {
          renderDesktopInsightPanel(activeDesktopInsightView);
        }
      }

      function getDesktopInsightViews() {
        return ["vacancies", "positions", "registrations"];
      }

      function normaliseDesktopInsightView(view) {
        var requested = String(view || "");
        return getDesktopInsightViews().indexOf(requested) === -1
          ? null
          : requested;
      }

      function updateDesktopInsightButtons() {
        var stats = document.getElementById("desktopScheduleStats");
        if (!stats || !stats.children) return;
        Array.prototype.forEach.call(stats.children, function (button) {
          var view = button.getAttribute("data-desktop-insight");
          if (!view) return;
          var active = view === activeDesktopInsightView;
          if (button.classList && button.classList.toggle) {
            button.classList.toggle("is-active", active);
          }
          button.setAttribute("aria-expanded", active ? "true" : "false");
        });
      }

      function getDesktopInsightEvents(predicate) {
        return ((gridData && gridData.events) || [])
          .filter(predicate)
          .slice()
          .sort(compareEventsByTime);
      }

      function getDesktopInsightEventMeta(event) {
        return [event.location, event.subtitle, event.description]
          .filter(function (value) {
            return value && String(value).trim() !== "";
          })
          .join(" · ");
      }

      function createDesktopInsightChip(roleMeta, text, lowAvailability) {
        var chip = document.createElement("span");
        chip.className =
          "desktop-insight-chip role-" +
          roleMeta.classSuffix +
          (lowAvailability ? " is-low" : "");
        chip.textContent = text;
        return chip;
      }

      function createDesktopInsightEventItem(event, view) {
        var item = document.createElement("button");
        item.type = "button";
        item.className = "desktop-insight-item";
        item.setAttribute("data-insight-eventid", event.eventId);

        var heading = document.createElement("div");
        heading.className = "desktop-insight-item-heading";

        var title = document.createElement("span");
        title.className = "desktop-insight-item-title";
        title.textContent = event.activity;

        var time = document.createElement("span");
        time.className = "desktop-insight-item-time";
        time.textContent = event.endTime
          ? formatTimeRange(event.startTime, event.endTime)
          : formatTime(event.startTime);

        heading.appendChild(title);
        heading.appendChild(time);
        item.appendChild(heading);

        var metaText = getDesktopInsightEventMeta(event);
        if (metaText) {
          var meta = document.createElement("div");
          meta.className = "desktop-insight-item-meta";
          meta.textContent = metaText;
          item.appendChild(meta);
        }

        var chips = document.createElement("div");
        chips.className = "desktop-insight-chips";

        if (view === "vacancies") {
          ROLE_KEYS.forEach(function (roleMeta) {
            var remaining = getRemainingForRole(event, roleMeta.key);
            if (remaining <= 0) return;
            chips.appendChild(
              createDesktopInsightChip(
                roleMeta,
                roleMeta.label + " " + formatRemainingSlots(remaining),
                remaining === 1,
              ),
            );
          });
        } else {
          ROLE_KEYS.forEach(function (roleMeta) {
            var roleSignups =
              (event.signupsByRole &&
                event.signupsByRole[roleMeta.label]) ||
              [];
            if (roleSignups.length === 0) return;
            chips.appendChild(
              createDesktopInsightChip(
                roleMeta,
                roleMeta.label + " " + roleSignups.length + "名",
                false,
              ),
            );
          });
        }

        if (chips.firstChild) item.appendChild(chips);

        if (view === "registrations") {
          var nameLines = [];
          ROLE_KEYS.forEach(function (roleMeta) {
            var roleSignups =
              (event.signupsByRole &&
                event.signupsByRole[roleMeta.label]) ||
              [];
            if (roleSignups.length === 0) return;
            nameLines.push(
              roleMeta.label +
                ": " +
                roleSignups
                  .map(function (signup) {
                    return signup.name;
                  })
                  .join(", "),
            );
          });
          if (nameLines.length > 0) {
            var names = document.createElement("div");
            names.className = "desktop-insight-names";
            names.textContent = nameLines.join(" / ");
            item.appendChild(names);
          }
        }

        return item;
      }

      function renderDesktopInsightEmpty(content, message) {
        var empty = document.createElement("div");
        empty.className = "desktop-insight-empty";
        empty.textContent = message;
        content.appendChild(empty);
      }

      function renderDesktopVacancyInsights(content) {
        var events = getDesktopInsightEvents(function (event) {
          return hasAnyAvailable(event.slots || {});
        });
        events.forEach(function (event) {
          content.appendChild(createDesktopInsightEventItem(event, "vacancies"));
        });
        if (events.length === 0) {
          renderDesktopInsightEmpty(content, "現在、空いている募集枠はありません。");
        }
      }

      function renderDesktopPositionInsights(content) {
        var events = (gridData && gridData.events) || [];
        var renderedCount = 0;

        ROLE_KEYS.forEach(function (roleMeta) {
          var matchingEvents = events.filter(function (event) {
            return getRemainingForRole(event, roleMeta.key) > 0;
          });
          var remaining = matchingEvents.reduce(function (total, event) {
            return total + getRemainingForRole(event, roleMeta.key);
          }, 0);
          if (remaining <= 0) return;

          var roleButton = document.createElement("button");
          roleButton.type = "button";
          roleButton.className = "desktop-insight-role";
          roleButton.setAttribute("data-insight-role", roleMeta.key);

          var heading = document.createElement("div");
          heading.className = "desktop-insight-role-heading";

          var title = document.createElement("span");
          title.className = "desktop-insight-role-title";
          title.textContent = roleMeta.label;

          var count = document.createElement("span");
          count.className = "desktop-insight-role-count";
          count.textContent = formatRemainingSlots(remaining);

          var meta = document.createElement("div");
          meta.className = "desktop-insight-role-meta";
          meta.textContent =
            matchingEvents.length +
            "件の募集 · クリックしてこのポジションに絞り込む";

          heading.appendChild(title);
          heading.appendChild(count);
          roleButton.appendChild(heading);
          roleButton.appendChild(meta);
          content.appendChild(roleButton);
          renderedCount += 1;
        });

        if (renderedCount === 0) {
          renderDesktopInsightEmpty(
            content,
            "現在、募集中のポジションはありません。",
          );
        }
      }

      function renderDesktopRegistrationInsights(content) {
        var events = getDesktopInsightEvents(function (event) {
          return event.signups && event.signups.length > 0;
        });
        events.forEach(function (event) {
          content.appendChild(
            createDesktopInsightEventItem(event, "registrations"),
          );
        });
        if (events.length === 0) {
          renderDesktopInsightEmpty(content, "現在の登録はありません。");
        }
      }

      function renderDesktopInsightPanel(view) {
        var activeView = normaliseDesktopInsightView(view);
        var panel = document.getElementById("desktopInsightsPanel");
        var title = document.getElementById("desktopInsightsTitle");
        var description = document.getElementById(
          "desktopInsightsDescription",
        );
        var content = document.getElementById("desktopInsightsContent");
        if (!activeView || !panel || !title || !description || !content) return;

        clearElement(content);
        content.className =
          "desktop-insights-content is-" + activeView;

        if (activeView === "vacancies") {
          title.textContent = "空き枠の一覧";
          description.textContent =
            "時間順に募集中の活動を表示しています。選択すると登録画面が開きます。";
          renderDesktopVacancyInsights(content);
        } else if (activeView === "positions") {
          title.textContent = "募集中のポジション";
          description.textContent =
            "ポジションを選ぶと、下の募集カードをその条件で絞り込みます。";
          renderDesktopPositionInsights(content);
        } else {
          title.textContent = "現在の登録";
          description.textContent =
            "登録を時間順に表示しています。選択すると登録・キャンセル画面が開きます。";
          renderDesktopRegistrationInsights(content);
        }
      }

      function closeDesktopInsightsPanel(restoreFocus) {
        var previousView = activeDesktopInsightView;
        var panel = document.getElementById("desktopInsightsPanel");
        activeDesktopInsightView = null;
        if (panel) panel.hidden = true;
        updateDesktopInsightButtons();

        if (!restoreFocus || !previousView) return;
        var stats = document.getElementById("desktopScheduleStats");
        if (!stats || !stats.children) return;
        Array.prototype.forEach.call(stats.children, function (button) {
          if (
            button.getAttribute("data-desktop-insight") === previousView &&
            button.focus
          ) {
            button.focus();
          }
        });
      }

      function setDesktopInsightView(view) {
        var nextView = normaliseDesktopInsightView(view);
        var panel = document.getElementById("desktopInsightsPanel");
        if (!nextView || !panel || isCompactLayout()) {
          closeDesktopInsightsPanel(false);
          return;
        }
        if (activeDesktopInsightView === nextView && !panel.hidden) {
          closeDesktopInsightsPanel(false);
          return;
        }

        activeDesktopInsightView = nextView;
        panel.hidden = false;
        updateDesktopInsightButtons();
        renderDesktopInsightPanel(nextView);
      }

      function formatRemainingSlots(remaining) {
        return "残り" + remaining + "枠";
      }

      function setMobileAgendaModeClass(container, mode) {
        var baseClass = String(container.className || "")
          .replace(/\bmobile-display-by-(activity|time|signup|overview)\b/g, "")
          .replace(/\s+/g, " ")
          .trim();
        container.className = (
          baseClass +
          " mobile-display-by-" +
          normaliseMobileDisplayMode(mode)
        ).trim();
      }

      function renderMobileEmptyState(container) {
        var empty = document.createElement("div");
        empty.className = "mobile-empty-state";
        empty.textContent =
          "条件に合う募集枠がありません";
        container.appendChild(empty);
      }

      function compareEventsByActivityOrder(a, b) {
        var activities = (gridData && gridData.activities) || [];
        var indexA = activities.indexOf(a.activity);
        var indexB = activities.indexOf(b.activity);
        if (indexA < 0) indexA = activities.length;
        if (indexB < 0) indexB = activities.length;
        if (indexA !== indexB) return indexA - indexB;
        return compareEventsByTime(a, b);
      }

      function eventsShareEndTime(events) {
        if (!events || events.length < 2) return true;
        var endTime = String(events[0].endTime || "");
        return events.every(function (event) {
          return String(event.endTime || "") === endTime;
        });
      }

      function getMobileTimeHeadingText(time, events) {
        var matchingEvents = events || [];
        if (
          matchingEvents.length > 0 &&
          matchingEvents[0].endTime &&
          eventsShareEndTime(matchingEvents)
        ) {
          return formatTimeRange(time, matchingEvents[0].endTime);
        }
        return formatTime(time);
      }

      function buildMobileSlotCard(event, options) {
        options = options || {};
        var showTime = options.showTime !== false;
        var card = document.createElement("button");
        card.className = "mobile-slot-card " + getActivityAccentClass(event.activity);
        card.type = "button";
        card.setAttribute("data-eventid", event.eventId);

        var header = document.createElement("div");
        header.className = "mobile-slot-header";

        var titleWrap = document.createElement("div");

        var title = document.createElement("div");
        title.className = "mobile-slot-title";
        title.textContent = event.activity;
        titleWrap.appendChild(title);

        if (showTime) {
          var timeLine = document.createElement("div");
          timeLine.className = "mobile-slot-time";
          timeLine.textContent = event.endTime
            ? formatTimeRange(event.startTime, event.endTime)
            : formatTime(event.startTime);
          titleWrap.appendChild(timeLine);
        }

        var meta = document.createElement("div");
        meta.className = "mobile-slot-meta";
        meta.textContent = event.location || "";
        titleWrap.appendChild(meta);

        if (event.subtitle && event.subtitle.trim() !== "") {
          var subtitle = document.createElement("div");
          subtitle.className = "mobile-slot-meta";
          subtitle.textContent = event.subtitle;
          titleWrap.appendChild(subtitle);
        }

        if (event.description && event.description.trim() !== "") {
          var desc = document.createElement("div");
          desc.className = "mobile-slot-desc";
          desc.textContent = event.description;
          titleWrap.appendChild(desc);
        }

        var badge = document.createElement("div");
        badge.className = "mobile-slot-badge";
        var available = hasAnyAvailable(event.slots);
        badge.textContent = available ? "" : "Full";
        if (!available) {
          badge.classList.add("is-full");
          card.classList.add("is-full");
        }

        header.appendChild(titleWrap);
        header.appendChild(badge);
        card.appendChild(header);

        var summary = document.createElement("div");
        summary.className = "mobile-slot-summary";
        ROLE_KEYS.forEach(function (r) {
          var s = event.slots[r.key];
          if (s.max === 0) return;
          var remaining = s.max - s.filled;
          var item = document.createElement("span");
          item.className =
            "mobile-slot-summary-item role-" + r.classSuffix;
          if (remaining <= 0) item.classList.add("is-full");
          item.textContent =
            r.label +
            "\u00a0" +
            (remaining <= 0 ? "Full" : formatRemainingSlots(remaining));
          summary.appendChild(item);
        });
        card.appendChild(summary);

        if (event.signups && event.signups.length > 0) {
          var namesList = document.createElement("div");
          namesList.className = "mobile-slot-names";
          ROLE_KEYS.forEach(function (r) {
            var roleSignups = event.signupsByRole[r.label] || [];
            if (roleSignups.length === 0) return;
            var group = document.createElement("div");
            group.className = "mobile-slot-name-group";

            var roleLabel = document.createElement("span");
            roleLabel.className = "mobile-slot-role-label " + r.nameClass;
            roleLabel.textContent = r.label + ":";
            group.appendChild(roleLabel);

            var namesSpan = document.createElement("span");
            namesSpan.className = "mobile-slot-name-list " + r.nameClass;
            namesSpan.textContent = roleSignups
              .map(function (signup) {
                return signup.name;
              })
              .join(", ");
            group.appendChild(namesSpan);

            namesList.appendChild(group);
          });
          card.appendChild(namesList);
        }

        return card;
      }

      function buildMobileAgendaByTime() {
        if (!gridData || !gridData.events) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }
        var container = getMobileAgenda();
        if (!container) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }

        setMobileAgendaModeClass(container, "signup");
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        var filteredEvents = getMobileFilteredEvents();
        var times = getMobileFilteredTimes(filteredEvents);
        times.forEach(function (time) {
          var matchingEvents = filteredEvents
            .filter(function (event) {
              return event.startTime === time;
            })
            .sort(compareEventsByActivityOrder);
          if (matchingEvents.length === 0) return;

          var section = document.createElement("section");
          section.className = "mobile-time-group";

          var heading = document.createElement("h2");
          heading.className = "mobile-time-heading";
          heading.textContent = getMobileTimeHeadingText(time, matchingEvents);
          section.appendChild(heading);

          matchingEvents.forEach(function (event) {
            section.appendChild(buildMobileSlotCard(event));
          });

          container.appendChild(section);
        });

        if (!container.firstChild) {
          renderMobileEmptyState(container);
        }
      }

      function getOverviewEventMeta(event) {
        return [event.location, event.subtitle, event.description]
          .filter(function (value) {
            return value && String(value).trim() !== "";
          })
          .join(" / ");
      }

      function buildMobileDayOverview() {
        if (!gridData || !gridData.events) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }
        var container = getMobileAgenda();
        if (!container) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }

        setMobileAgendaModeClass(container, "overview");
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        var timeline = document.createElement("div");
        timeline.className = "mobile-overview-timeline";
        var activity = getMobileActivityFilter();
        var events = (gridData.events || [])
          .filter(function (event) {
            return eventMatchesActivityFilter(event, activity);
          })
          .slice();
        var times = getOrderedValuesForEvents(
          events,
          "startTime",
          (gridData && gridData.times) || [],
        );

        times.forEach(function (time) {
          var matchingEvents = events
            .filter(function (event) {
              return event.startTime === time;
            })
            .sort(compareEventsByActivityOrder);
          if (matchingEvents.length === 0) return;

          var block = document.createElement("section");
          block.className = "mobile-overview-time-block";

          var timeLabel = document.createElement("div");
          timeLabel.className = "mobile-overview-time";
          timeLabel.textContent = getMobileTimeHeadingText(time, matchingEvents);
          block.appendChild(timeLabel);

          var items = document.createElement("div");
          items.className = "mobile-overview-items";
          matchingEvents.forEach(function (event) {
            var item = document.createElement("button");
            item.className =
              "mobile-overview-item " + getActivityAccentClass(event.activity);
            item.type = "button";
            item.setAttribute("data-eventid", event.eventId);

            var text = document.createElement("div");
            var title = document.createElement("div");
            title.className = "mobile-overview-title";
            title.textContent = event.activity;
            text.appendChild(title);

            var metaText = getOverviewEventMeta(event);
            if (metaText) {
              var meta = document.createElement("div");
              meta.className = "mobile-overview-meta";
              meta.textContent = metaText;
              text.appendChild(meta);
            }

            var roleChips = document.createElement("div");
            roleChips.className = "mobile-overview-role-chips";
            var hasOpenRole = false;
            ROLE_KEYS.forEach(function (r) {
              var remaining = getRemainingForRole(event, r.key);
              if (remaining <= 0) return;
              if (!hasOpenRole) {
                var roleChipLabel = document.createElement("span");
                roleChipLabel.className = "mobile-overview-role-chip-label";
                roleChipLabel.textContent = "募集中";
                roleChips.appendChild(roleChipLabel);
                hasOpenRole = true;
              }
              var chip = document.createElement("span");
              chip.className =
                "mobile-overview-role-chip role-" + r.classSuffix;
              chip.textContent = r.label + " " + remaining;
              roleChips.appendChild(chip);
            });
            if (!hasOpenRole) {
              var fullChip = document.createElement("span");
              fullChip.className = "mobile-overview-role-chip is-full";
              fullChip.textContent = "Full";
              roleChips.appendChild(fullChip);
            }

            item.appendChild(text);
            item.appendChild(roleChips);
            items.appendChild(item);
          });

          block.appendChild(items);
          timeline.appendChild(block);
        });

        if (timeline.firstChild) {
          container.appendChild(timeline);
        } else {
          renderMobileEmptyState(container);
        }
      }

      function buildMobileAgenda() {
        updateDesktopScheduleSummary();
        var filters = document.getElementById("mobileAvailabilityControl");
        var activeMode = getMobileDisplayMode();
        if (activeMode !== "signup") {
          mobileTimeFilterDropdownOpen = false;
        }
        if (filters) {
          filters.style.display = "";
          filters.classList.toggle("is-signup-mode", activeMode === "signup");
          filters.classList.toggle("is-overview-mode", activeMode === "overview");
        }
        updateMobileAvailabilityControl();
        if (activeMode === "signup") {
          buildMobileAgendaByTime();
        } else {
          buildMobileDayOverview();
        }
      }

      function renderResponsiveView() {
        var compact = isCompactLayout();
        document.body.classList.toggle("compact-layout", compact);
        document.body.classList.toggle("desktop-layout", !compact);
        if (compact) closeDesktopInsightsPanel(false);
      }
      function formatTime(time) {
        if (!time) return "";
        var parts = time.split(":");
        var h = parseInt(parts[0]);
        var m = parts[1] || "00";
        var ampm = h >= 12 ? "pm" : "am";
        h = h % 12 || 12;
        return h + ":" + m + " " + ampm;
      }

      function formatTimeRange(startTime, endTime) {
        return formatTime(startTime) + " - " + formatTime(endTime);
      }

      function normaliseWhitespace(value) {
        return String(value)
          .replace(/[\s\u3000]+/g, " ")
          .trim();
      }

      // Class matching canonicalises a narrow Kanji digit set. Names must
      // preserve these characters verbatim.
      var CLASS_KANJI_DIGITS = {
        "\u3007": "0",
        "\u96F6": "0",
        "\u4E00": "1",
        "\u4E8C": "2",
        "\u4E09": "3",
        "\u56DB": "4",
        "\u4E94": "5",
        "\u516D": "6",
        "\u4E03": "7",
        "\u516B": "8",
        "\u4E5D": "9",
      };

      function normaliseAsciiDigits(value) {
        return String(value).replace(/[\uFF10-\uFF19]/g, function (char) {
          return String.fromCharCode(char.charCodeAt(0) - 0xfee0);
        });
      }

      function normaliseBrackets(value) {
        return String(value)
          .replace(/\uFF08/g, "(")
          .replace(/\uFF09/g, ")");
      }

      function hasJapaneseNameCharacters(value) {
        return /[\u3005\u3006\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\uFF66-\uFF9F]/.test(
          String(value),
        );
      }

      function normaliseNameSpacing(value) {
        var normalisedValue = normaliseWhitespace(value);
        if (hasJapaneseNameCharacters(normalisedValue)) {
          return normalisedValue.replace(/[\s\u3000]+/g, "");
        }
        return normalisedValue;
      }

      function normaliseNameValue(value) {
        return normaliseNameSpacing(normaliseBrackets(value));
      }

      function isValidNameValue(value) {
        return /^[\p{L}\p{N}\s\-'.()]+$/u.test(value);
      }

      function normaliseKanjiDigits(value) {
        return String(value).replace(
          /[\u3007\u96F6\u4E00\u4E8C\u4E09\u56DB\u4E94\u516D\u4E03\u516B\u4E5D]/g,
          function (char) {
            return CLASS_KANJI_DIGITS[char];
          },
        );
      }

      function isClassTokenChar(char) {
