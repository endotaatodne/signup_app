        return /^[0-9A-Za-z\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]$/.test(char);
      }

      function normaliseClassSeparators(value) {
        var source = String(value);
        var result = "";

        for (var i = 0; i < source.length; i += 1) {
          var char = source.charAt(i);
          if (/[\u2010-\u2015\u2212\uFF0D]/.test(char)) {
            result += "-";
            continue;
          }

          if (
            char === "\u30FC" &&
            isClassTokenChar(source.charAt(i - 1)) &&
            isClassTokenChar(source.charAt(i + 1))
          ) {
            result += "-";
            continue;
          }

          result += char;
        }

        return result;
      }

      function normaliseClassValue(value) {
        return normaliseClassSeparators(
          normaliseWhitespace(normaliseKanjiDigits(normaliseAsciiDigits(value))),
        );
      }

      function normaliseComparable(value) {
        return normaliseNameValue(value).toLowerCase();
      }

      function normaliseClassComparable(value) {
        return normaliseClassValue(value).toLowerCase();
      }

      function openModal(eventId) {
        if (!gridData || !gridData.events) {
          setTimeout(function () {
            openModal(eventId);
          }, 100);
          return;
        }
        var event = getEventById(eventId);
        if (!event) return;

        currentEventId = eventId;
        currentRole = null;

        document.getElementById("modalTitle").textContent = event.activity;
        var subtitle =
          formatTimeRange(event.startTime, event.endTime) +
          " — " +
          event.location;
        if (event.description && event.description.trim() !== "") {
          subtitle += " — " + event.description;
        }
        document.getElementById("modalSubtitle").textContent = subtitle;

        // Names grouped by role
        var namesSection = document.getElementById("namesSection");
        var namesGroups = document.getElementById("namesGroups");
        while (namesGroups.firstChild) {
          namesGroups.removeChild(namesGroups.firstChild);
        }
        var hasAnySignups = false;
        ROLE_KEYS.forEach(function (r) {
          var roleSignups = event.signupsByRole[r.label] || [];
          if (roleSignups.length === 0) return;
          hasAnySignups = true;
          var group = document.createElement("div");
          group.className = "names-role-group";
          var label = document.createElement("div");
          label.className = "names-role-label " + r.labelClass;
          label.textContent = r.label;
          group.appendChild(label);
          var chips = document.createElement("div");
          chips.className = "names-chips";
          roleSignups.forEach(function (s) {
            var chip = document.createElement("div");
            chip.className = "name-chip " + r.nameClass;
            chip.textContent = s.name;
            if (s.cls) {
              var clsSpan = document.createElement("span");
              clsSpan.className = "name-chip-class";
              clsSpan.textContent = " — " + s.cls;
              chip.appendChild(clsSpan);
            }
            chips.appendChild(chip);
          });
          group.appendChild(chips);
          namesGroups.appendChild(group);
        });
        namesSection.style.display = hasAnySignups ? "block" : "none";

        var roleButtons = document.getElementById("roleButtons");
        while (roleButtons.firstChild) {
          roleButtons.removeChild(roleButtons.firstChild);
        }
        ROLE_KEYS.forEach(function (r) {
          var s = event.slots[r.key];
          if (s.max === 0) return;
          var btn = document.createElement("button");
          btn.className = "role-btn " + r.btnClass;
          btn.setAttribute("data-role", r.label);
          var remaining = s.max - s.filled;
          var isFull = remaining <= 0;
          if (isFull) {
            btn.classList.add("role-btn-full");
            btn.disabled = true;
          } else {
            btn.addEventListener("click", function () {
              selectRole(r.label, btn);
            });
          }
          var labelDiv = document.createElement("div");
          labelDiv.className = "role-btn-label";
          labelDiv.textContent = r.label;
          var countDiv = document.createElement("div");
          countDiv.className = "role-btn-count";
          countDiv.textContent = isFull
            ? "Full"
            : formatRemainingSlots(remaining);
          btn.appendChild(labelDiv);
          btn.appendChild(countDiv);
          roleButtons.appendChild(btn);
        });

        var allFull = ROLE_KEYS.every(function (r) {
          var s = event.slots[r.key];
          return s.max === 0 || s.filled >= s.max;
        });
        if (allFull) {
          var fullMsg = document.createElement("div");
          fullMsg.className = "modal-full-message";
          fullMsg.textContent =
            "この枠はおかげさまで定員に達しました。ありがとうございます。";
          roleButtons.appendChild(fullMsg);
        }

        document.getElementById("modalForm").className = "modal-form";
        document.getElementById("inputName").value = "";
        document.getElementById("inputClass").value = "";
        document.getElementById("modalMessage").style.display = "none";
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = SIGNUP_BTN_TEXT;

        var modalTabs = document.getElementById("modalTabs");
        modalTabs.style.display = event.signups.length > 0 ? "flex" : "none";

        resetCancelSignupSelection();
        clearElement(document.getElementById("cancelSignupList"));
        switchTab("signup");

        document.getElementById("modalOverlay").classList.add("active");
        document.body.style.overflow = "hidden";
        if (!isCompactLayout()) {
          document.getElementById("inputName").focus();
        }
      }

      function selectRole(roleLabel, btn) {
        currentRole = roleLabel;
        document.querySelectorAll(".role-btn").forEach(function (b) {
          b.classList.remove("selected");
        });
        btn.classList.add("selected");

        // Show form with matching submit button colour
        var modalForm = document.getElementById("modalForm");
        modalForm.className = "modal-form visible";
        var submitBtn = document.getElementById("submitBtn");
        submitBtn.className = "modal-submit";
        var roleKey = ROLE_KEYS.find(function (r) {
          return r.label === roleLabel;
        });
        if (roleKey) {
          submitBtn.classList.add("modal-submit-" + roleKey.classSuffix);
        }
        submitBtn.textContent = SIGNUP_BTN_TEXT;
        document.getElementById("modalMessage").style.display = "none";
        if (!isCompactLayout()) {
          document.getElementById("inputName").focus();
        }
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("active");
        document.getElementById("cancelForm").className = "cancel-form";
        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        resetCancelSignupSelection();
        clearElement(document.getElementById("cancelSignupList"));
        document.getElementById("confirmYes").disabled = false;
        document.getElementById("confirmYes").textContent =
          "はい、キャンセルします。";
        document.getElementById("confirmNo").disabled = false;
        currentEventId = null;
        currentRole = null;
        document.body.style.overflow = "";
        if (!isCompactLayout()) {
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
          var top = document.querySelector("h1");
          if (top) top.scrollIntoView({ behavior: "smooth" });
        }
      }

      function switchTab(tab) {
        var roleButtons = document.getElementById("roleButtons");
        var modalForm = document.getElementById("modalForm");
        var cancelForm = document.getElementById("cancelForm");
        var tabSignup = document.getElementById("tabSignup");
        var tabCancel = document.getElementById("tabCancel");

        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        document.getElementById("cancelSubmitBtn").style.display = "block";
        document.getElementById("cancelSubmitBtn").disabled =
          !currentCancelSignup;
        document.getElementById("cancelSubmitBtn").textContent =
          "選択した登録をキャンセル";
        document.getElementById("confirmYes").disabled = false;
        document.getElementById("confirmYes").textContent =
          "はい、キャンセルします。";
        document.getElementById("confirmNo").disabled = false;

        if (tab === "signup") {
          tabSignup.className = "modal-tab active-signup";
          tabCancel.className = "modal-tab";
          document.getElementById("signupHelper").style.display = "block";
          var signupEvent = getEventById(currentEventId);
          document.getElementById("namesSection").style.display =
            signupEvent && signupEvent.signups.length > 0 ? "block" : "none";
          roleButtons.style.display = "";
          modalForm.className = currentRole
            ? "modal-form visible"
            : "modal-form";
          cancelForm.className = "cancel-form";
        } else {
          tabSignup.className = "modal-tab";
          tabCancel.className = "modal-tab active-cancel";
          document.getElementById("signupHelper").style.display = "none";
          document.getElementById("namesSection").style.display = "none";
          roleButtons.style.display = "none";
          modalForm.className = "modal-form";
          cancelForm.className = "cancel-form visible";
          resetCancelSignupSelection();
          document.getElementById("cancelSubmitBtn").disabled = true;
          renderCancelSignupList();
        }
        resetModalTabScroll(tab);
      }

      function resetModalTabScroll(tab) {
        var modal = document.querySelector(".modal");
        if (modal) modal.scrollTop = 0;

        var tabScrollArea =
          tab === "cancel"
            ? document.getElementById("cancelSignupList")
            : document.getElementById("namesSection");
        if (tabScrollArea) tabScrollArea.scrollTop = 0;
      }

      function resetCancelSignupSelection() {
        currentCancelSignup = null;
        currentCancelOption = null;
      }

      function renderCancelSignupList() {
        var list = document.getElementById("cancelSignupList");
        resetCancelSignupSelection();
        clearElement(list);
        var event = getEventById(currentEventId);
        if (!event) return;

        ROLE_KEYS.forEach(function (roleMeta) {
          var roleSignups = event.signupsByRole[roleMeta.label] || [];
          roleSignups.forEach(function (signup) {
            var option = document.createElement("button");
            option.type = "button";
            option.className = "cancel-signup-option";
            option.cancelSignupData = signup;
            option.setAttribute("data-cancel-signup", "");
            option.setAttribute("aria-pressed", "false");

            var name = document.createElement("span");
            name.className = "cancel-signup-name";
            name.textContent = signup.name;

            var details = document.createElement("span");
            details.className = "cancel-signup-details";
            details.textContent = signup.cls + " · " + signup.role;

            option.appendChild(name);
            option.appendChild(details);
            list.appendChild(option);
          });
        });
      }

      function selectCancelSignup(signup, selectedOption) {
        if (!signup || !selectedOption) return;

        if (currentCancelOption && currentCancelOption !== selectedOption) {
          currentCancelOption.classList.remove("selected");
          currentCancelOption.setAttribute("aria-pressed", "false");
        }

        currentCancelSignup = {
          name: signup.name,
          cls: signup.cls,
          role: signup.role,
        };
        currentCancelOption = selectedOption;
        selectedOption.classList.add("selected");
        selectedOption.setAttribute("aria-pressed", "true");

        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        document.getElementById("cancelSubmitBtn").style.display = "block";
        document.getElementById("cancelSubmitBtn").disabled = false;
      }

      function setCancelSignupListDisabled(disabled) {
        var options = document.getElementById("cancelSignupList").children;
        Array.prototype.forEach.call(options, function (option) {
          option.disabled = disabled;
        });
      }

      function findAndConfirmCancel() {
        var msg = document.getElementById("cancelMessage");
        msg.style.display = "none";

        if (!currentCancelSignup) {
          showCancelMessage("キャンセルする登録を選んでください。", false);
          return;
        }

        var confirmText = document.getElementById("confirmText");
        clearElement(confirmText);

        var question = document.createElement("div");
        question.className = "confirm-question";
        question.textContent = "本当に以下の登録をキャンセルしますか？";

        var summary = document.createElement("div");
        summary.className = "confirm-signup-summary";

        var name = document.createElement("span");
        name.className = "confirm-signup-name";
        name.textContent = currentCancelSignup.name;

        var details = document.createElement("span");
        details.className = "confirm-signup-details";
        details.textContent =
          currentCancelSignup.cls + " · " + currentCancelSignup.role;

        summary.appendChild(name);
        summary.appendChild(details);
        confirmText.appendChild(question);
        confirmText.appendChild(summary);

        var confirmBox = document.getElementById("confirmBox");
        confirmBox.style.display = "block";
        document.getElementById("cancelSubmitBtn").style.display = "none";
        if (confirmBox.scrollIntoView) {
          confirmBox.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "nearest",
          });
        }
      }

      function confirmCancel() {
        if (!currentCancelSignup) {
          showCancelMessage("キャンセルする登録を選んでください。", false);
          return;
        }

        var name = currentCancelSignup.name;
        var cls = currentCancelSignup.cls;
        var role = currentCancelSignup.role;
        var btn = document.getElementById("confirmYes");

        btn.disabled = true;
        btn.textContent = "キャンセル中...";
        document.getElementById("confirmNo").disabled = true;
        document.getElementById("cancelSubmitBtn").disabled = true;
        setCancelSignupListDisabled(true);

        google.script.run
          .withSuccessHandler(function (result) {
            if (result.success) {
              showCancelMessage(result.message, true);
              setTimeout(function () {
                if (EXEC_URL) {
                  window.top.location.href = EXEC_URL;
                } else {
                  // Fallback
                  window.top.location.reload();
                }
              }, 1500);
            } else {
              showCancelMessage(result.message, false);
              document.getElementById("confirmBox").style.display = "none";
              btn.disabled = false;
              btn.textContent = "はい、キャンセルします。";
              document.getElementById("confirmNo").disabled = false;
              setCancelSignupListDisabled(false);
              document.getElementById("cancelSubmitBtn").style.display =
                "block";
            }
          })
          .withFailureHandler(function (error) {
            showCancelMessage(
              "エラーが発生しました。再度試してください。",
              false,
            );
            document.getElementById("confirmBox").style.display = "none";
            btn.disabled = false;
            btn.textContent = "はい、キャンセルします。";
            document.getElementById("confirmNo").disabled = false;
            setCancelSignupListDisabled(false);
            document.getElementById("cancelSubmitBtn").style.display = "block";
          })
          .cancelSignup(currentEventId, name, cls, role, alias);
      }

      function showMessage(targetId, message, success) {
        var msgDiv = document.getElementById(targetId);
        var refreshPrompt = "ページをリフレッシュしてください。";
        msgDiv.textContent = "";
        msgDiv.className = "modal-message " + (success ? "success" : "error");

        if (success && message.indexOf(refreshPrompt) !== -1) {
          msgDiv.className += " action-needed";

          var mainText = message.replace(refreshPrompt, "").trim();
          if (mainText) {
            var mainSpan = document.createElement("span");
            mainSpan.className = "modal-message-main";
            mainSpan.textContent = mainText;
            msgDiv.appendChild(mainSpan);
          }

          var emphasisSpan = document.createElement("span");
          emphasisSpan.className = "modal-message-emphasis";
          emphasisSpan.textContent = refreshPrompt;
          msgDiv.appendChild(emphasisSpan);
        } else {
          msgDiv.textContent = message;
        }

        msgDiv.style.display = "block";
      }

      function showCancelMessage(message, success) {
        showMessage("cancelMessage", message, success);
      }

      function rebuildCurrentView() {
        buildMobileAgenda();
      }

      function shouldRefreshAfterSubmitRejection(result) {
        return result && result.code === "slot_full";
      }

      function refreshGridDataAfterSubmitRejection(eventId, message) {
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success || !result.gridData) return;

            gridData = result.gridData;
            buildGridIndexes();
            rebuildCurrentView();

            if (
              currentEventId !== null &&
              String(currentEventId) === String(eventId) &&
              getEventById(eventId)
            ) {
              openModal(eventId);
              showModalMessage(message, false);
            }
          })
          .withFailureHandler(function () {})
          .getGridDataForAlias(alias);
      }

      function submitSignup() {
        // This is intentionally only a low-friction client-side filter. Real
        // abuse protection is enforced server-side via rate limiting.
        if (document.getElementById("honeypot").value !== "") return;
        // This is also only a client-side friction check. The backend rate
        // limiter remains the actual enforcement point.
        if (Date.now() - PAGE_LOAD_TIME < 3000) {
          showModalMessage("少し待ってから送信してください。", false);
          return;
        }
        if (!currentRole) {
          showModalMessage("登録したポジションを選択してください。", false);
          return;
        }

        var name = normaliseNameValue(document.getElementById("inputName").value);
        var cls = normaliseClassValue(document.getElementById("inputClass").value);
        var btn = document.getElementById("submitBtn");

        if (!name) {
          showModalMessage("名前を入力してください。", false);
          return;
        }
        if (name.length > 50) {
          showModalMessage("名前は５０文字以下で入力してください。", false);
          return;
        }
        if (!isValidNameValue(name)) {
          showModalMessage("名前に不正な文字が含まれています。", false);
          return;
        }
        if (!cls) {
          showModalMessage("クラスを入力してください。", false);
          return;
        }
        if (cls.length > 10) {
          showModalMessage("クラスは１０文字以下で入力してください。", false);
          return;
        }
        if (!/^[\p{L}\p{N}\s\-'.]+$/u.test(cls)) {
          showModalMessage("クラス名に不正な文字が含まれています。", false);
          return;
        }

        btn.disabled = true;
        btn.textContent = "送信中...";
        document.getElementById("modalMessage").style.display = "none";

        google.script.run
          .withSuccessHandler(function (result) {
            showModalMessage(result.message, result.success);
            if (result.success) {
              var event = getEventById(currentEventId);
              if (event) {
                var signup = {
                  name: result.name || name,
                  cls: result.cls || cls,
                  role: currentRole,
                };
                event.signups.push(signup);
                if (!event.signupsByRole[currentRole]) {
                  event.signupsByRole[currentRole] = [];
                }
                event.signupsByRole[currentRole].push(signup);
                var roleKey = ROLE_KEYS.find(function (r) {
                  return r.label === currentRole;
                });
                if (roleKey) event.slots[roleKey.key].filled++;
              }
              buildMobileAgenda();
              setTimeout(closeModal, 1500);
            } else {
              btn.disabled = false;
              btn.textContent = SIGNUP_BTN_TEXT;
              if (shouldRefreshAfterSubmitRejection(result)) {
                refreshGridDataAfterSubmitRejection(
                  currentEventId,
                  result.message,
                );
              }
            }
          })
          .withFailureHandler(function (error) {
            showModalMessage("問題が発生しました。再度試してください。", false);
            btn.disabled = false;
            btn.textContent = SIGNUP_BTN_TEXT;
          })
          .submitSignup(currentEventId, name, cls, currentRole, alias);
      }

      function showModalMessage(message, success) {
        showMessage("modalMessage", message, success);
      }

      document
        .getElementById("modalOverlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });
      document.getElementById("closeBtn").addEventListener("click", closeModal);
      document
        .getElementById("tabSignup")
        .addEventListener("click", function () {
          switchTab("signup");
        });
      document
        .getElementById("tabCancel")
        .addEventListener("click", function () {
          switchTab("cancel");
        });
      document
        .getElementById("cancelSubmitBtn")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          findAndConfirmCancel();
        });
      document
        .getElementById("cancelSignupList")
        .addEventListener("click", function (e) {
          var option =
            e.target && e.target.closest
              ? e.target.closest("[data-cancel-signup]")
              : null;
          var list = document.getElementById("cancelSignupList");
          if (!option || !list.contains(option) || option.disabled) return;
          selectCancelSignup(option.cancelSignupData, option);
        });
      document
        .getElementById("confirmYes")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          confirmCancel();
        });
      document
        .getElementById("confirmNo")
        .addEventListener("click", function () {
          document.getElementById("confirmBox").style.display = "none";
          document.getElementById("cancelSubmitBtn").style.display = "block";
        });
      document
        .getElementById("submitBtn")
        .addEventListener("click", submitSignup);
      document
        .getElementById("inputName")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitSignup();
        });
      document
        .getElementById("inputClass")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitSignup();
        });

      document
        .getElementById("desktopScheduleStats")
        .addEventListener("click", function (e) {
          var button =
            e.target && e.target.closest
              ? e.target.closest("[data-desktop-insight]")
              : null;
          if (!button || !this.contains(button)) return;
          if (e.stopPropagation) e.stopPropagation();
          setDesktopInsightView(button.getAttribute("data-desktop-insight"));
        });
      document
        .getElementById("desktopInsightsPanel")
        .addEventListener("click", function (e) {
          var closeButton =
            e.target && e.target.closest
              ? e.target.closest("#desktopInsightsClose")
              : null;
          if (closeButton) {
            if (e.stopPropagation) e.stopPropagation();
            closeDesktopInsightsPanel(true);
            return;
          }

          var roleButton =
            e.target && e.target.closest
              ? e.target.closest("[data-insight-role]")
              : null;
          if (roleButton) {
            if (e.stopPropagation) e.stopPropagation();
            var roleKey = roleButton.getAttribute("data-insight-role");
            closeDesktopInsightsPanel(false);
            setMobileDisplayMode("signup");
            setMobileRoleFilter(roleKey);
            scrollDesktopAgendaIntoView();
            return;
          }

          var eventButton =
            e.target && e.target.closest
              ? e.target.closest("[data-insight-eventid]")
              : null;
          if (eventButton) {
            if (e.stopPropagation) e.stopPropagation();
            var eventId = eventButton.getAttribute("data-insight-eventid");
            closeDesktopInsightsPanel(false);
            openModal(eventId);
          }
        });
      document.addEventListener("click", function (e) {
        if (!activeDesktopInsightView) return;
        var target = e.target;
        var stats = document.getElementById("desktopScheduleStats");
        var panel = document.getElementById("desktopInsightsPanel");
        var insideStats = stats && target && stats.contains(target);
        var insidePanel = panel && target && panel.contains(target);
        if (!insideStats && !insidePanel) {
          closeDesktopInsightsPanel(false);
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && activeDesktopInsightView) {
          closeDesktopInsightsPanel(true);
        }
      });

      document
        .getElementById("mobileAgenda")
        .addEventListener("click", function (e) {
          var slot = e.target.closest("[data-eventid]");
          if (slot) {
            openModal(slot.getAttribute("data-eventid"));
          }
        });
      document
        .getElementById("mobileDisplayModeControl")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-display-mode]")
              : null;
          if (!btn) return;
          setMobileDisplayMode(btn.getAttribute("data-mobile-display-mode"));
        });
      document
        .getElementById("mobileTimeAvailabilityToggle")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          setMobileTimeFilterDropdownOpen(!mobileTimeFilterDropdownOpen);
        });
      document
        .getElementById("mobileTimeAvailabilityFilter")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-time-filter]")
              : null;
          if (!btn || btn.disabled) return;
          setMobileAvailableTimeFilter(btn.getAttribute("data-mobile-time-filter"));
        });
      document.addEventListener("click", function (e) {
        if (!mobileTimeFilterDropdownOpen) return;
        var target = e.target;
        var timeToggle = document.getElementById("mobileTimeAvailabilityToggle");
        var timeFilter = document.getElementById("mobileTimeAvailabilityFilter");
        var insideToggle =
          timeToggle &&
          target &&
          ((timeToggle.contains && timeToggle.contains(target)) ||
            (target.closest &&
              target.closest("#mobileTimeAvailabilityToggle")));
        var insideFilter =
          timeFilter &&
          target &&
          ((timeFilter.contains && timeFilter.contains(target)) ||
            (target.closest &&
              target.closest("#mobileTimeAvailabilityFilter")));
        if (!insideToggle && !insideFilter) {
          setMobileTimeFilterDropdownOpen(false);
        }
      });
      document
        .getElementById("mobileActivityFilter")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-activity-filter]")
              : null;
          if (!btn) return;
          setMobileActivityFilter(btn.getAttribute("data-mobile-activity-filter"));
        });
      document
        .getElementById("mobileRoleAvailabilityFilter")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-role-filter]")
              : null;
          if (!btn) return;
          setMobileRoleFilter(btn.getAttribute("data-mobile-role-filter"));
        });
      document
        .getElementById("mobileKeywordSearch")
        .addEventListener("input", function (e) {
          setMobileKeywordSearchQuery(e.target.value);
        });

      document.getElementById("pageTitle").textContent = PAGE_TITLE;
      updateMobileDisplayModeControl();
      updateMobileAvailabilityControl();

      google.script.run
        .withSuccessHandler(function (url) {
          EXEC_URL =
            url +
            (url.indexOf("?") === -1 ? "?" : "&") +
            "event=" +
            encodeURIComponent(alias);
        })
        .getDeployedUrl();

      buildGridIndexes();
      renderResponsiveView();
      buildMobileAgenda();
      window.addEventListener("resize", function () {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(function () {
          renderResponsiveView();
        }, 120);
      });
    </script>

    <div
      style="margin-top: 2rem; font-size: 12px; color: #888; text-align: center"
    >
      <a
        href="https://github.com/endotaatodne/signup_app"
        target="_blank"
        rel="noopener noreferrer"
        style="color: #888"
        >このアプリについて</a
      >
    </div>
  </body>
