<!doctype html>
<!--
  @fileoverview Main Apps Script HTML template. It composes the responsive
  schedule, signup modal, shared styles, and ordered client-side scripts while
  bootstrapping server-provided event data.
-->
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup App</title>
<!-- Shared application styles are emitted by the server-side include helper. -->
<?!= include_("Styles"); ?>
  </head>
  <body>
<!-- Primary schedule and modal markup. -->
<?!= include_("Schedule"); ?>
<?!= include_("SignupModal"); ?>
    <script>
      /**
       * Decodes a Base64-encoded UTF-8 value supplied by the server template.
       * @param {string} str The Base64-encoded UTF-8 value.
       * @returns {string} The decoded Unicode text.
       */
      function b64decode(str) {
        return decodeURIComponent(
          atob(str)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join(""),
        );
      }

      // Template payload and shared client state used by the included scripts.
      var EXEC_URL = "";
      var PAGE_LOAD_TIME = Date.now();
      var SIGNUP_BTN_TEXT = "登録する";
      var gridData = JSON.parse(b64decode("<?!= gridData ?>"));
      var alias = b64decode("<?!= alias ?>");
      var EVENT_STATUS_OPEN = "OPEN";
      var EVENT_STATUS_READ_ONLY = "READ_ONLY";
      var eventStatus = b64decode("<?!= eventStatus ?>");
      var ROLES = JSON.parse(b64decode("<?!= roles ?>"));
      var PAGE_TITLE = b64decode("<?!= title ?>");
      var currentEventId = null;
      var currentRole = null;
      var currentCancelSignup = null;
      var currentCancelOption = null;
      var resizeTimer = null;
      var MOBILE_DISPLAY_MODE_STORAGE_KEY = "signupApp.mobileDisplayMode";
      var DEFAULT_MOBILE_DISPLAY_MODE = "signup";
      var MOBILE_TIME_FILTER_ALL = "__all__";
      var MOBILE_ROLE_FILTER_ALL = "__all__";
      var MOBILE_ACTIVITY_FILTER_ALL = "__all__";
      var mobileAvailableTimeFilter = [];
      var mobileRoleAvailabilityFilter = MOBILE_ROLE_FILTER_ALL;
      var mobileActivityFilter = MOBILE_ACTIVITY_FILTER_ALL;
      var mobileKeywordSearchQuery = "";
      var mobileTimeFilterDropdownOpen = false;
      var desktopFilterPopoverOpen = "";
      var activeDesktopInsightView = null;
      var DESKTOP_INSIGHT_SCOPE_OVERALL = "overall";
      var DESKTOP_INSIGHT_SCOPE_FILTERED = "filtered";
    </script>
<!-- Feature scripts are ordered to preserve their shared browser-global scope. -->
<?!= include_("ClientCore"); ?>
<?!= include_("ClientFilters"); ?>
<?!= include_("ClientInsights"); ?>
<?!= include_("ClientSchedule"); ?>
<?!= include_("ClientFormatting"); ?>
<?!= include_("ClientModal"); ?>
<?!= include_("ClientInit"); ?>

    <div
      style="margin-top: 2rem; font-size: 12px; color: #888; text-align: center"
    >
      <a
        href="https://github.com/endotaatodne/signup_app"
        target="_blank"
        rel="noopener noreferrer"
        style="color: #888"
        >このアプリについて</a
      >
    </div>
  </body>
</html>
