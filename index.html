          var allRoleButton = document.createElement("button");
          allRoleButton.type = "button";
          allRoleButton.className =
            "mobile-role-filter-pill" +
            (roleKey === MOBILE_ROLE_FILTER_ALL ? " is-active" : "");
          allRoleButton.setAttribute("data-mobile-role-filter", MOBILE_ROLE_FILTER_ALL);
          allRoleButton.setAttribute(
            "aria-pressed",
            roleKey === MOBILE_ROLE_FILTER_ALL ? "true" : "false",
          );
          allRoleButton.textContent =
            "すべてのポジション";
          roleFilter.appendChild(allRoleButton);

          availableRoleOptions.forEach(function (r) {
            var roleButton = document.createElement("button");
            var active = roleKey === r.key;
            roleButton.type = "button";
            roleButton.className =
              "mobile-role-filter-pill role-" +
              r.classSuffix +
              (active ? " is-active" : "");
            roleButton.setAttribute("data-mobile-role-filter", r.key);
            roleButton.setAttribute("aria-pressed", active ? "true" : "false");
            roleButton.textContent = r.label;
            roleFilter.appendChild(roleButton);
          });
        }

        if (keywordInput && keywordInput.value !== mobileKeywordSearchQuery) {
          keywordInput.value = mobileKeywordSearchQuery;
        }

        var selectedOptions = options.filter(function (option) {
          return selectedTimes.indexOf(String(option.time)) !== -1;
        });
        if (timeDetail) {
          if (selectedOptions.length === 1) {
            timeDetail.textContent =
              "この時間の空き: " +
              formatRoleAvailabilitySummary(selectedOptions[0].roleSummaries);
          } else if (selectedOptions.length > 1) {
            var selectedEvents = [];
            selectedOptions.forEach(function (option) {
              selectedEvents = selectedEvents.concat(option.events || []);
            });
            timeDetail.textContent =
              selectedOptions.length +
              "つの時間帯の空き: " +
              formatRoleAvailabilitySummary(
                getAvailableRoleSummariesForEvents(selectedEvents, roleKey),
              );
          } else if (options.length > 0) {
            timeDetail.textContent = "すべての時間帯を表示中";
          } else {
            timeDetail.textContent = "条件に合う時間帯はありません";
          }
        }
      }

      function getScheduleSummaryCounts(events, registrationRoleKey) {
        var availableCount = 0;
        var capacityCount = 0;
        var signupCount = 0;
        var registrationRole = ROLE_KEYS.find(function (roleMeta) {
          return roleMeta.key === registrationRoleKey;
        });

        (events || []).forEach(function (event) {
          var signups = event.signups || [];
          signupCount += registrationRole
            ? signups.filter(function (signup) {
                return signup.role === registrationRole.label;
              }).length
            : signups.length;
          ROLE_KEYS.forEach(function (roleMeta) {
            var slot = getRoleSlot(event, roleMeta.key) || {};
            var remaining = getRemainingForRole(event, roleMeta.key);
            availableCount += remaining;
            if (!registrationRole || roleMeta.key === registrationRole.key) {
              capacityCount += Math.max(0, Number(slot.max) || 0);
            }
          });
        });

        return {
          availableCount: availableCount,
          capacityCount: capacityCount,
          signupCount: signupCount,
        };
      }

      function getVisibleScheduleEvents() {
        if (getMobileDisplayMode() === "overview") {
          var activity = getMobileActivityFilter();
          return ((gridData && gridData.events) || []).filter(function (event) {
            return eventMatchesActivityFilter(event, activity);
          });
        }
        return getMobileFilteredEvents();
      }

      function hasActiveScheduleFilters() {
        var activityActive =
          getMobileActivityFilter() !== MOBILE_ACTIVITY_FILTER_ALL;
        if (getMobileDisplayMode() === "overview") return activityActive;
        return (
          activityActive ||
          getMobileRoleFilter() !== MOBILE_ROLE_FILTER_ALL ||
          getMobileAvailableTimeFilters().length > 0 ||
          getMobileKeywordSearchQuery() !== ""
        );
      }

      function updateDesktopFilteredContext(node, text, visible) {
        if (!node) return;
        node.textContent = visible ? text : "";
        if (node.classList && node.classList.toggle) {
          node.classList.toggle("is-visible", visible);
        }
        node.setAttribute("aria-hidden", visible ? "false" : "true");
      }

      function updateDesktopScheduleSummary() {
        var allEvents = (gridData && gridData.events) || [];
        var overallCounts = getScheduleSummaryCounts(allEvents);
        var availableNode = document.getElementById("desktopAvailableCount");
        var signupNode = document.getElementById("desktopSignupCount");
        var signupCapacityNode = document.getElementById(
          "desktopSignupCapacityCount",
        );
        if (availableNode) {
          availableNode.textContent = overallCounts.availableCount;
        }
        if (signupNode) signupNode.textContent = overallCounts.signupCount + "名";
        if (signupCapacityNode) {
          signupCapacityNode.textContent =
            "/ " + overallCounts.capacityCount + "枠";
        }

        var filtersActive = hasActiveScheduleFilters();
        var filteredEvents = filtersActive ? getVisibleScheduleEvents() : [];
        var filteredRegistrationRole =
          getMobileDisplayMode() === "signup"
            ? getMobileRoleFilter()
            : MOBILE_ROLE_FILTER_ALL;
        var filteredCounts = filtersActive
          ? getScheduleSummaryCounts(
              filteredEvents,
              filteredRegistrationRole,
            )
          : {
              availableCount: 0,
              capacityCount: 0,
              signupCount: 0,
            };

        updateDesktopFilteredContext(
          document.getElementById("desktopFilteredAvailableCount"),
          "表示中 " + filteredCounts.availableCount + "枠",
          filtersActive,
        );
        updateDesktopFilteredContext(
          document.getElementById("desktopFilteredSignupCount"),
          "表示中 " +
            filteredCounts.signupCount +
            "名 / " +
            filteredCounts.capacityCount +
            "枠",
          filtersActive,
        );
        updateDesktopFilteredContext(
          document.getElementById("desktopFilterSummary"),
          "絞り込み中：" + filteredEvents.length + "件表示",
          filtersActive,
        );

        var panel = document.getElementById("desktopInsightsPanel");
        if (
          activeDesktopInsightView &&
          panel &&
          !panel.hidden
        ) {
          renderDesktopInsightPanel(activeDesktopInsightView);
        }
      }

      function getDesktopInsightViews() {
        return ["vacancies", "registrations"];
      }

      function normaliseDesktopInsightView(view) {
        var requested = String(view || "");
        return getDesktopInsightViews().indexOf(requested) === -1
          ? null
          : requested;
      }

      function updateDesktopInsightButtons() {
        var stats = document.getElementById("desktopScheduleStats");
        if (!stats || !stats.children) return;
        Array.prototype.forEach.call(stats.children, function (button) {
          var view = button.getAttribute("data-desktop-insight");
          if (!view) return;
          var active = view === activeDesktopInsightView;
          if (button.classList && button.classList.toggle) {
            button.classList.toggle("is-active", active);
          }
          button.setAttribute("aria-expanded", active ? "true" : "false");
        });
      }

      function getDesktopInsightEventMeta(event) {
        return [event.location, event.subtitle, event.description]
          .filter(function (value) {
            return value && String(value).trim() !== "";
          })
          .join(" · ");
      }

      function createDesktopInsightChip(roleMeta, text, lowAvailability) {
        var chip = document.createElement("span");
        chip.className =
          "desktop-insight-chip role-" +
          roleMeta.classSuffix +
          (lowAvailability ? " is-low" : "");
        chip.textContent = text;
        return chip;
      }

      function createDesktopInsightEventItem(event, view) {
        var item = document.createElement("button");
        item.type = "button";
        item.className =
          "desktop-insight-item has-activity-ribbon " +
          getActivityAccentClass(event.activity);
        item.setAttribute("data-insight-eventid", event.eventId);

        var heading = document.createElement("div");
        heading.className = "desktop-insight-item-heading";

        var title = document.createElement("span");
        title.className = "desktop-insight-item-title";
        title.textContent = event.activity;

        var time = document.createElement("span");
        time.className = "desktop-insight-item-time";
        time.textContent = event.endTime
          ? formatTimeRange(event.startTime, event.endTime)
          : formatTime(event.startTime);

        heading.appendChild(title);
        heading.appendChild(time);
        item.appendChild(heading);

        var metaText = getDesktopInsightEventMeta(event);
        if (metaText) {
          var meta = document.createElement("div");
          meta.className = "desktop-insight-item-meta";
          meta.textContent = metaText;
          item.appendChild(meta);
        }

        var chips = document.createElement("div");
        chips.className = "desktop-insight-chips";

        if (view === "vacancies") {
          ROLE_KEYS.forEach(function (roleMeta) {
            var remaining = getRemainingForRole(event, roleMeta.key);
            if (remaining <= 0) return;
            chips.appendChild(
              createDesktopInsightChip(
                roleMeta,
                roleMeta.label + " " + formatRemainingSlots(remaining),
                remaining === 1,
              ),
            );
          });
        } else {
          ROLE_KEYS.forEach(function (roleMeta) {
            var roleSignups =
              (event.signupsByRole &&
                event.signupsByRole[roleMeta.label]) ||
              [];
            if (roleSignups.length === 0) return;
            chips.appendChild(
              createDesktopInsightChip(
                roleMeta,
                roleMeta.label + " " + roleSignups.length + "名",
                false,
              ),
            );
          });
        }

        if (chips.firstChild) item.appendChild(chips);

        if (view === "registrations") {
          var nameLines = [];
          ROLE_KEYS.forEach(function (roleMeta) {
            var roleSignups =
              (event.signupsByRole &&
                event.signupsByRole[roleMeta.label]) ||
              [];
            if (roleSignups.length === 0) return;
            nameLines.push(
              roleMeta.label +
                ": " +
                roleSignups
                  .map(function (signup) {
                    return signup.name;
                  })
                  .join(", "),
            );
          });
          if (nameLines.length > 0) {
            var names = document.createElement("div");
            names.className = "desktop-insight-names";
            names.textContent = nameLines.join(" / ");
            item.appendChild(names);
          }
        }

        return item;
      }

      function renderDesktopInsightEmpty(content, message) {
        var empty = document.createElement("div");
        empty.className = "desktop-insight-empty";
        empty.textContent = message;
        content.appendChild(empty);
      }

      function getDesktopVacancyEvents(events) {
        return (events || [])
          .filter(function (event) {
            return getAvailableSlotCount(event) > 0;
          })
          .slice()
          .sort(compareEventsByTime);
      }

      function normaliseDesktopInsightScope(scope, filtersActive) {
        return scope === DESKTOP_INSIGHT_SCOPE_FILTERED && filtersActive
          ? DESKTOP_INSIGHT_SCOPE_FILTERED
          : DESKTOP_INSIGHT_SCOPE_OVERALL;
      }

      function updateDesktopInsightScopeControl(
        overallCount,
        filteredCount,
        filtersActive,
      ) {
        var control = document.getElementById(
          "desktopInsightScopeControl",
        );
        var overallButton = document.getElementById(
          "desktopInsightScopeOverall",
        );
        var filteredButton = document.getElementById(
          "desktopInsightScopeFiltered",
        );
        var overallCountNode = document.getElementById(
          "desktopInsightScopeOverallCount",
        );
        var filteredCountNode = document.getElementById(
          "desktopInsightScopeFilteredCount",
        );

        if (control) control.hidden = false;
        if (overallCountNode) overallCountNode.textContent = overallCount + "件";
        if (filteredCountNode) {
          filteredCountNode.textContent = filteredCount + "件";
        }
        if (filteredButton) filteredButton.hidden = !filtersActive;

        [
          {
            button: overallButton,
            scope: DESKTOP_INSIGHT_SCOPE_OVERALL,
          },
          {
            button: filteredButton,
            scope: DESKTOP_INSIGHT_SCOPE_FILTERED,
          },
        ].forEach(function (item) {
          if (!item.button) return;
          var active = item.scope === desktopInsightScope;
          if (item.button.classList && item.button.classList.toggle) {
            item.button.classList.toggle("is-active", active);
          }
          item.button.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      function setDesktopInsightScope(scope) {
        desktopInsightScope = normaliseDesktopInsightScope(
          scope,
          hasActiveScheduleFilters(),
        );
        if (activeDesktopInsightView) {
          renderDesktopInsightPanel(activeDesktopInsightView);
        }
      }

      function renderDesktopVacancyInsights(content) {
        var overallEvents = getDesktopVacancyEvents(
          (gridData && gridData.events) || [],
        );
        var filtersActive = hasActiveScheduleFilters();
        var filteredEvents = filtersActive
          ? getDesktopVacancyEvents(getVisibleScheduleEvents())
          : [];
        desktopInsightScope = normaliseDesktopInsightScope(
          desktopInsightScope,
          filtersActive,
        );
        updateDesktopInsightScopeControl(
          overallEvents.length,
          filteredEvents.length,
          filtersActive,
        );

        var filteredScope =
          desktopInsightScope === DESKTOP_INSIGHT_SCOPE_FILTERED;
        var events = filteredScope ? filteredEvents : overallEvents;
        var description = document.getElementById(
          "desktopInsightsDescription",
        );
        if (description) {
          description.textContent = filteredScope
            ? "現在の絞り込みに合う空き枠を時間順に表示しています。選択すると登録画面が開きます。"
            : "全体の募集から、時間順に募集中の活動を表示しています。選択すると登録画面が開きます。";
        }

        events.forEach(function (event) {
          content.appendChild(createDesktopInsightEventItem(event, "vacancies"));
        });
        if (events.length === 0) {
          renderDesktopInsightEmpty(
            content,
            filteredScope
              ? "現在の絞り込みに合う空き枠はありません。"
              : "現在、空いている募集枠はありません。",
          );
        }
      }

      function getDesktopRegistrationEvents(events) {
        return (events || [])
          .filter(function (event) {
            return event.signups && event.signups.length > 0;
          })
          .slice()
          .sort(compareEventsByTime);
      }

      function renderDesktopRegistrationInsights(content) {
        var overallEvents = getDesktopRegistrationEvents(
          (gridData && gridData.events) || [],
        );
        var filtersActive = hasActiveScheduleFilters();
        var filteredEvents = filtersActive
          ? getDesktopRegistrationEvents(getVisibleScheduleEvents())
          : [];
        desktopInsightScope = normaliseDesktopInsightScope(
          desktopInsightScope,
          filtersActive,
        );
        updateDesktopInsightScopeControl(
          overallEvents.length,
          filteredEvents.length,
          filtersActive,
        );

        var filteredScope =
          desktopInsightScope === DESKTOP_INSIGHT_SCOPE_FILTERED;
        var events = filteredScope ? filteredEvents : overallEvents;
        var description = document.getElementById(
          "desktopInsightsDescription",
        );
        if (description) {
          description.textContent = filteredScope
            ? "現在の絞り込みに合う募集枠の登録を、時間順に表示しています。選択すると登録・キャンセル画面が開きます。"
            : "全体の登録を時間順に表示しています。選択すると登録・キャンセル画面が開きます。";
        }

        events.forEach(function (event) {
          content.appendChild(
            createDesktopInsightEventItem(event, "registrations"),
          );
        });
        if (events.length === 0) {
          renderDesktopInsightEmpty(
            content,
            filteredScope
              ? "現在の絞り込みに合う募集枠には、登録がありません。"
              : "現在の登録はありません。",
          );
        }
      }

      function renderDesktopInsightPanel(view) {
        var activeView = normaliseDesktopInsightView(view);
        var panel = document.getElementById("desktopInsightsPanel");
        var title = document.getElementById("desktopInsightsTitle");
        var description = document.getElementById(
          "desktopInsightsDescription",
        );
        var content = document.getElementById("desktopInsightsContent");
        var scopeControl = document.getElementById(
          "desktopInsightScopeControl",
        );
        if (!activeView || !panel || !title || !description || !content) return;

        if (scopeControl) {
          scopeControl.hidden = false;
          scopeControl.setAttribute(
            "aria-label",
            activeView === "vacancies"
              ? "空き枠の表示範囲"
              : "登録の表示範囲",
          );
        }
        clearElement(content);
        content.className =
          "desktop-insights-content is-" + activeView;

        if (activeView === "vacancies") {
          title.textContent = "空き枠の一覧";
          description.textContent =
            "全体の募集から、時間順に募集中の活動を表示しています。選択すると登録画面が開きます。";
          renderDesktopVacancyInsights(content);
        } else {
          title.textContent = "現在の登録";
          description.textContent =
            "全体の登録を時間順に表示しています。選択すると登録・キャンセル画面が開きます。";
          renderDesktopRegistrationInsights(content);
        }
      }

      function closeDesktopInsightsPanel(restoreFocus) {
        var previousView = activeDesktopInsightView;
        var panel = document.getElementById("desktopInsightsPanel");
        activeDesktopInsightView = null;
        if (panel) panel.hidden = true;
        updateDesktopInsightButtons();

        if (!restoreFocus || !previousView) return;
        var stats = document.getElementById("desktopScheduleStats");
        if (!stats || !stats.children) return;
        Array.prototype.forEach.call(stats.children, function (button) {
          if (
            button.getAttribute("data-desktop-insight") === previousView &&
            button.focus
          ) {
            button.focus();
          }
        });
      }

      function setDesktopInsightView(view) {
        var nextView = normaliseDesktopInsightView(view);
        var panel = document.getElementById("desktopInsightsPanel");
        if (!nextView || !panel || isCompactLayout()) {
          closeDesktopInsightsPanel(false);
          return;
        }
        if (activeDesktopInsightView === nextView && !panel.hidden) {
          closeDesktopInsightsPanel(false);
          return;
        }

        desktopInsightScope = DESKTOP_INSIGHT_SCOPE_OVERALL;
        activeDesktopInsightView = nextView;
        panel.hidden = false;
        updateDesktopInsightButtons();
        renderDesktopInsightPanel(nextView);
      }

      function formatRemainingSlots(remaining) {
        return "残り" + remaining + "枠";
      }

      function setMobileAgendaModeClass(container, mode) {
        var baseClass = String(container.className || "")
          .replace(/\bmobile-display-by-(activity|time|signup|overview)\b/g, "")
          .replace(/\s+/g, " ")
          .trim();
        container.className = (
          baseClass +
          " mobile-display-by-" +
          normaliseMobileDisplayMode(mode)
        ).trim();
      }

      function renderMobileEmptyState(container) {
        var empty = document.createElement("div");
        empty.className = "mobile-empty-state";
        empty.textContent =
          "条件に合う募集枠がありません";
        container.appendChild(empty);
      }

      function compareEventsByActivityOrder(a, b) {
        var activities = (gridData && gridData.activities) || [];
        var indexA = activities.indexOf(a.activity);
        var indexB = activities.indexOf(b.activity);
        if (indexA < 0) indexA = activities.length;
        if (indexB < 0) indexB = activities.length;
        if (indexA !== indexB) return indexA - indexB;
        return compareEventsByTime(a, b);
      }

      function eventsShareEndTime(events) {
        if (!events || events.length < 2) return true;
        var endTime = String(events[0].endTime || "");
        return events.every(function (event) {
          return String(event.endTime || "") === endTime;
        });
      }

      function getMobileTimeHeadingText(time, events) {
        var matchingEvents = events || [];
        if (
          matchingEvents.length > 0 &&
          matchingEvents[0].endTime &&
          eventsShareEndTime(matchingEvents)
        ) {
          return formatTimeRange(time, matchingEvents[0].endTime);
        }
        return formatTime(time);
      }

      function buildMobileSlotCard(event, options) {
        options = options || {};
        var showTime = options.showTime !== false;
        var card = document.createElement("button");
        card.className = "mobile-slot-card " + getActivityAccentClass(event.activity);
        card.type = "button";
        card.setAttribute("data-eventid", event.eventId);

        var header = document.createElement("div");
        header.className = "mobile-slot-header";

        var titleWrap = document.createElement("div");

        var title = document.createElement("div");
        title.className = "mobile-slot-title";
        title.textContent = event.activity;
        titleWrap.appendChild(title);

        if (showTime) {
          var timeLine = document.createElement("div");
          timeLine.className = "mobile-slot-time";
          timeLine.textContent = event.endTime
            ? formatTimeRange(event.startTime, event.endTime)
            : formatTime(event.startTime);
          titleWrap.appendChild(timeLine);
        }

        var meta = document.createElement("div");
        meta.className = "mobile-slot-meta";
        meta.textContent = event.location || "";
        titleWrap.appendChild(meta);

        if (event.subtitle && event.subtitle.trim() !== "") {
          var subtitle = document.createElement("div");
          subtitle.className = "mobile-slot-meta";
          subtitle.textContent = event.subtitle;
          titleWrap.appendChild(subtitle);
        }

        if (event.description && event.description.trim() !== "") {
          var desc = document.createElement("div");
          desc.className = "mobile-slot-desc";
          desc.textContent = event.description;
          titleWrap.appendChild(desc);
        }

        var badge = document.createElement("div");
        badge.className = "mobile-slot-badge";
        var available = hasAnyAvailable(event.slots);
        badge.textContent = available ? "" : "Full";
        if (!available) {
          badge.classList.add("is-full");
          card.classList.add("is-full");
        }

        header.appendChild(titleWrap);
        header.appendChild(badge);
        card.appendChild(header);

        var summary = document.createElement("div");
        summary.className = "mobile-slot-summary";
        ROLE_KEYS.forEach(function (r) {
          var s = event.slots[r.key];
          if (s.max === 0) return;
          var remaining = s.max - s.filled;
          var item = document.createElement("span");
          item.className =
            "mobile-slot-summary-item role-" + r.classSuffix;
          if (remaining <= 0) item.classList.add("is-full");
          item.textContent =
            r.label +
            "\u00a0" +
            (remaining <= 0 ? "Full" : formatRemainingSlots(remaining));
          summary.appendChild(item);
        });
        card.appendChild(summary);

        if (event.signups && event.signups.length > 0) {
          var namesList = document.createElement("div");
          namesList.className = "mobile-slot-names";
          ROLE_KEYS.forEach(function (r) {
            var roleSignups = event.signupsByRole[r.label] || [];
            if (roleSignups.length === 0) return;
            var group = document.createElement("div");
            group.className = "mobile-slot-name-group";

            var roleLabel = document.createElement("span");
            roleLabel.className = "mobile-slot-role-label " + r.nameClass;
            roleLabel.textContent = r.label + ":";
            group.appendChild(roleLabel);

            var namesSpan = document.createElement("span");
            namesSpan.className = "mobile-slot-name-list " + r.nameClass;
            namesSpan.textContent = roleSignups
              .map(function (signup) {
                return signup.name;
              })
              .join(", ");
            group.appendChild(namesSpan);

            namesList.appendChild(group);
          });
          card.appendChild(namesList);
        }

        return card;
      }

      function buildMobileAgendaByTime() {
        if (!gridData || !gridData.events) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }
        var container = getMobileAgenda();
        if (!container) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }

        setMobileAgendaModeClass(container, "signup");
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        var filteredEvents = getMobileFilteredEvents();
        var times = getMobileFilteredTimes(filteredEvents);
        times.forEach(function (time) {
          var matchingEvents = filteredEvents
            .filter(function (event) {
              return event.startTime === time;
            })
            .sort(compareEventsByActivityOrder);
          if (matchingEvents.length === 0) return;

          var section = document.createElement("section");
          section.className = "mobile-time-group";

          var heading = document.createElement("h2");
          heading.className = "mobile-time-heading";
          heading.textContent = getMobileTimeHeadingText(time, matchingEvents);
          section.appendChild(heading);

          matchingEvents.forEach(function (event) {
            section.appendChild(buildMobileSlotCard(event));
          });

          container.appendChild(section);
        });

        if (!container.firstChild) {
          renderMobileEmptyState(container);
        }
      }

      function getOverviewEventMeta(event) {
        return [event.location, event.subtitle, event.description]
          .filter(function (value) {
            return value && String(value).trim() !== "";
          })
          .join(" / ");
      }

      function buildMobileDayOverview() {
        if (!gridData || !gridData.events) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }
        var container = getMobileAgenda();
        if (!container) {
          setTimeout(buildMobileAgenda, 200);
          return;
        }

        setMobileAgendaModeClass(container, "overview");
        while (container.firstChild) {
          container.removeChild(container.firstChild);
        }

        var timeline = document.createElement("div");
        timeline.className = "mobile-overview-timeline";
        var activity = getMobileActivityFilter();
        var events = (gridData.events || [])
          .filter(function (event) {
            return eventMatchesActivityFilter(event, activity);
          })
          .slice();
        var times = getOrderedValuesForEvents(
          events,
          "startTime",
          (gridData && gridData.times) || [],
        );

        times.forEach(function (time) {
          var matchingEvents = events
            .filter(function (event) {
              return event.startTime === time;
            })
            .sort(compareEventsByActivityOrder);
          if (matchingEvents.length === 0) return;

          var block = document.createElement("section");
          block.className = "mobile-overview-time-block";

          var timeLabel = document.createElement("div");
          timeLabel.className = "mobile-overview-time";
          timeLabel.textContent = getMobileTimeHeadingText(time, matchingEvents);
          block.appendChild(timeLabel);

          var items = document.createElement("div");
          items.className = "mobile-overview-items";
          matchingEvents.forEach(function (event) {

        document.body.classList.toggle("compact-layout", compact);
        document.body.classList.toggle("desktop-layout", !compact);

      }
      function formatTime(time) {
        if (!time) return "";
        var parts = time.split(":");
        var h = parseInt(parts[0]);
        var m = parts[1] || "00";
        var ampm = h >= 12 ? "pm" : "am";
        h = h % 12 || 12;
        return h + ":" + m + " " + ampm;
      }

      function formatTimeRange(startTime, endTime) {
        return formatTime(startTime) + " - " + formatTime(endTime);
      }

      function normaliseWhitespace(value) {
        return String(value)
          .replace(/[\s\u3000]+/g, " ")
          .trim();
      }

      // Class matching canonicalises a narrow Kanji digit set. Names must
      // preserve these characters verbatim.
      var CLASS_KANJI_DIGITS = {
        "\u3007": "0",
        "\u96F6": "0",
        "\u4E00": "1",
        "\u4E8C": "2",
        "\u4E09": "3",
        "\u56DB": "4",
        "\u4E94": "5",
        "\u516D": "6",
        "\u4E03": "7",
        "\u516B": "8",
        "\u4E5D": "9",
      };

      function normaliseAsciiDigits(value) {
        return String(value).replace(/[\uFF10-\uFF19]/g, function (char) {
          return String.fromCharCode(char.charCodeAt(0) - 0xfee0);
        });
      }

      function normaliseBrackets(value) {
        return String(value)
          .replace(/\uFF08/g, "(")
          .replace(/\uFF09/g, ")");
      }

      function hasJapaneseNameCharacters(value) {
        return /[\u3005\u3006\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\uFF66-\uFF9F]/.test(
          String(value),
        );
      }

      function normaliseNameSpacing(value) {
        var normalisedValue = normaliseWhitespace(value);
        if (hasJapaneseNameCharacters(normalisedValue)) {
          return normalisedValue.replace(/[\s\u3000]+/g, "");
        }
        return normalisedValue;
      }

      function normaliseNameValue(value) {
        return normaliseNameSpacing(normaliseBrackets(value));
      }

      function isValidNameValue(value) {
        return /^[\p{L}\p{N}\s\-'.()]+$/u.test(value);
      }

      function normaliseKanjiDigits(value) {
        return String(value).replace(
          /[\u3007\u96F6\u4E00\u4E8C\u4E09\u56DB\u4E94\u516D\u4E03\u516B\u4E5D]/g,
          function (char) {
            return CLASS_KANJI_DIGITS[char];
          },
        );
      }

      function isClassTokenChar(char) {
        return /^[0-9A-Za-z\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]$/.test(char);
      }

      function normaliseClassSeparators(value) {
        var source = String(value);
        var result = "";

        for (var i = 0; i < source.length; i += 1) {
          var char = source.charAt(i);
          if (/[\u2010-\u2015\u2212\uFF0D]/.test(char)) {
            result += "-";
            continue;
          }

          if (
            char === "\u30FC" &&
            isClassTokenChar(source.charAt(i - 1)) &&
            isClassTokenChar(source.charAt(i + 1))
          ) {
            result += "-";
            continue;
          }

          result += char;
        }

        return result;
      }

      function normaliseClassValue(value) {
        return normaliseClassSeparators(
          normaliseWhitespace(normaliseKanjiDigits(normaliseAsciiDigits(value))),
        );
      }

      function normaliseComparable(value) {
        return normaliseNameValue(value).toLowerCase();
      }

      function normaliseClassComparable(value) {
        return normaliseClassValue(value).toLowerCase();
      }

      function openModal(eventId) {
        if (!gridData || !gridData.events) {
          setTimeout(function () {
            openModal(eventId);
          }, 100);
          return;
        }
        var event = getEventById(eventId);
        if (!event) return;

        currentEventId = eventId;
        currentRole = null;

        document.getElementById("modalTitle").textContent = event.activity;
        var subtitle =
          formatTimeRange(event.startTime, event.endTime) +
          " — " +
          event.location;
        if (event.description && event.description.trim() !== "") {
          subtitle += " — " + event.description;
        }
        document.getElementById("modalSubtitle").textContent = subtitle;

        // Names grouped by role
        var namesSection = document.getElementById("namesSection");
        var namesGroups = document.getElementById("namesGroups");
        while (namesGroups.firstChild) {
          namesGroups.removeChild(namesGroups.firstChild);
        }
        var hasAnySignups = false;
        ROLE_KEYS.forEach(function (r) {
          var roleSignups = event.signupsByRole[r.label] || [];
          if (roleSignups.length === 0) return;
          hasAnySignups = true;
          var group = document.createElement("div");
          group.className = "names-role-group";
          var label = document.createElement("div");
          label.className = "names-role-label " + r.labelClass;
          label.textContent = r.label;
          group.appendChild(label);
          var chips = document.createElement("div");
          chips.className = "names-chips";
          roleSignups.forEach(function (s) {
            var chip = document.createElement("div");
            chip.className = "name-chip " + r.nameClass;
            chip.textContent = s.name;
            if (s.cls) {
              var clsSpan = document.createElement("span");
              clsSpan.className = "name-chip-class";
              clsSpan.textContent = " — " + s.cls;
              chip.appendChild(clsSpan);
            }
            chips.appendChild(chip);
          });
          group.appendChild(chips);
          namesGroups.appendChild(group);
        });
        namesSection.style.display = hasAnySignups ? "block" : "none";

        var roleButtons = document.getElementById("roleButtons");
        while (roleButtons.firstChild) {
          roleButtons.removeChild(roleButtons.firstChild);
        }
        ROLE_KEYS.forEach(function (r) {
          var s = event.slots[r.key];
          if (s.max === 0) return;
          var btn = document.createElement("button");
          btn.className = "role-btn " + r.btnClass;
          btn.setAttribute("data-role", r.label);
          var remaining = s.max - s.filled;
          var isFull = remaining <= 0;
          if (isFull) {
            btn.classList.add("role-btn-full");
            btn.disabled = true;
          } else {
            btn.addEventListener("click", function () {
              selectRole(r.label, btn);
            });
          }
          var labelDiv = document.createElement("div");
          labelDiv.className = "role-btn-label";
          labelDiv.textContent = r.label;
          var countDiv = document.createElement("div");
          countDiv.className = "role-btn-count";
          countDiv.textContent = isFull
            ? "Full"
            : formatRemainingSlots(remaining);
          btn.appendChild(labelDiv);
          btn.appendChild(countDiv);
          roleButtons.appendChild(btn);
        });

        var allFull = ROLE_KEYS.every(function (r) {
          var s = event.slots[r.key];
          return s.max === 0 || s.filled >= s.max;
        });
        if (allFull) {
          var fullMsg = document.createElement("div");
          fullMsg.className = "modal-full-message";
          fullMsg.textContent =
            "この枠はおかげさまで定員に達しました。ありがとうございます。";
          roleButtons.appendChild(fullMsg);
        }

        document.getElementById("modalForm").className = "modal-form";
        document.getElementById("inputName").value = "";
        document.getElementById("inputClass").value = "";
        document.getElementById("modalMessage").style.display = "none";
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = SIGNUP_BTN_TEXT;

        var modalTabs = document.getElementById("modalTabs");
        modalTabs.style.display = event.signups.length > 0 ? "flex" : "none";

        resetCancelSignupSelection();
        clearElement(document.getElementById("cancelSignupList"));
        switchTab("signup");

        document.getElementById("modalOverlay").classList.add("active");
        document.body.style.overflow = "hidden";
        if (!isCompactLayout()) {
          document.getElementById("inputName").focus();
        }
      }

      function selectRole(roleLabel, btn) {
        currentRole = roleLabel;
        document.querySelectorAll(".role-btn").forEach(function (b) {
          b.classList.remove("selected");
        });
        btn.classList.add("selected");

        // Show form with matching submit button colour
        var modalForm = document.getElementById("modalForm");
        modalForm.className = "modal-form visible";
        var submitBtn = document.getElementById("submitBtn");
        submitBtn.className = "modal-submit";
        var roleKey = ROLE_KEYS.find(function (r) {
          return r.label === roleLabel;
        });
        if (roleKey) {
          submitBtn.classList.add("modal-submit-" + roleKey.classSuffix);
        }
        submitBtn.textContent = SIGNUP_BTN_TEXT;
        document.getElementById("modalMessage").style.display = "none";
        if (!isCompactLayout()) {
          document.getElementById("inputName").focus();
        }
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("active");
        document.getElementById("cancelForm").className = "cancel-form";
        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        resetCancelSignupSelection();
        clearElement(document.getElementById("cancelSignupList"));
        document.getElementById("confirmYes").disabled = false;
        document.getElementById("confirmYes").textContent =
          "はい、キャンセルします。";
        document.getElementById("confirmNo").disabled = false;
        currentEventId = null;
        currentRole = null;
        document.body.style.overflow = "";
        if (!isCompactLayout()) {
          document.body.scrollTop = 0;
          document.documentElement.scrollTop = 0;
          var top = document.querySelector("h1");
          if (top) top.scrollIntoView({ behavior: "smooth" });
        }
      }

      function switchTab(tab) {
        var roleButtons = document.getElementById("roleButtons");
        var modalForm = document.getElementById("modalForm");
        var cancelForm = document.getElementById("cancelForm");
        var tabSignup = document.getElementById("tabSignup");
        var tabCancel = document.getElementById("tabCancel");

        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        document.getElementById("cancelSubmitBtn").style.display = "block";
        document.getElementById("cancelSubmitBtn").disabled =
          !currentCancelSignup;
        document.getElementById("cancelSubmitBtn").textContent =
          "選択した登録をキャンセル";
        document.getElementById("confirmYes").disabled = false;
        document.getElementById("confirmYes").textContent =
          "はい、キャンセルします。";
        document.getElementById("confirmNo").disabled = false;

        if (tab === "signup") {
          tabSignup.className = "modal-tab active-signup";
          tabCancel.className = "modal-tab";
          document.getElementById("signupHelper").style.display = "block";
          var signupEvent = getEventById(currentEventId);
          document.getElementById("namesSection").style.display =
            signupEvent && signupEvent.signups.length > 0 ? "block" : "none";
          roleButtons.style.display = "";
          modalForm.className = currentRole
            ? "modal-form visible"
            : "modal-form";
          cancelForm.className = "cancel-form";
        } else {
          tabSignup.className = "modal-tab";
          tabCancel.className = "modal-tab active-cancel";
          document.getElementById("signupHelper").style.display = "none";
          document.getElementById("namesSection").style.display = "none";
          roleButtons.style.display = "none";
          modalForm.className = "modal-form";
          cancelForm.className = "cancel-form visible";
          resetCancelSignupSelection();
          document.getElementById("cancelSubmitBtn").disabled = true;
          renderCancelSignupList();
        }
        resetModalTabScroll(tab);
      }

      function resetModalTabScroll(tab) {
        var modal = document.querySelector(".modal");
        if (modal) modal.scrollTop = 0;

        var tabScrollArea =
          tab === "cancel"
            ? document.getElementById("cancelSignupList")
            : document.getElementById("namesSection");
        if (tabScrollArea) tabScrollArea.scrollTop = 0;
      }

      function resetCancelSignupSelection() {
        currentCancelSignup = null;
        currentCancelOption = null;
      }

      function renderCancelSignupList() {
        var list = document.getElementById("cancelSignupList");
        resetCancelSignupSelection();
        clearElement(list);
        var event = getEventById(currentEventId);
        if (!event) return;

        ROLE_KEYS.forEach(function (roleMeta) {
          var roleSignups = event.signupsByRole[roleMeta.label] || [];
          roleSignups.forEach(function (signup) {
            var option = document.createElement("button");
            option.type = "button";
            option.className = "cancel-signup-option";
            option.cancelSignupData = signup;
            option.setAttribute("data-cancel-signup", "");
            option.setAttribute("aria-pressed", "false");

            var name = document.createElement("span");
            name.className = "cancel-signup-name";
            name.textContent = signup.name;

            var details = document.createElement("span");
            details.className = "cancel-signup-details";
            details.textContent = signup.cls + " · " + signup.role;

            option.appendChild(name);
            option.appendChild(details);
            list.appendChild(option);
          });
        });
      }

      function selectCancelSignup(signup, selectedOption) {
        if (!signup || !selectedOption) return;

        if (currentCancelOption && currentCancelOption !== selectedOption) {
          currentCancelOption.classList.remove("selected");
          currentCancelOption.setAttribute("aria-pressed", "false");
        }

        currentCancelSignup = {
          name: signup.name,
          cls: signup.cls,
          role: signup.role,
        };
        currentCancelOption = selectedOption;
        selectedOption.classList.add("selected");
        selectedOption.setAttribute("aria-pressed", "true");

        document.getElementById("confirmBox").style.display = "none";
        document.getElementById("cancelMessage").style.display = "none";
        document.getElementById("cancelSubmitBtn").style.display = "block";
        document.getElementById("cancelSubmitBtn").disabled = false;
      }

      function setCancelSignupListDisabled(disabled) {
        var options = document.getElementById("cancelSignupList").children;
        Array.prototype.forEach.call(options, function (option) {
          option.disabled = disabled;
        });
      }

      function findAndConfirmCancel() {
        var msg = document.getElementById("cancelMessage");
        msg.style.display = "none";

        if (!currentCancelSignup) {
          showCancelMessage("キャンセルする登録を選んでください。", false);
          return;
        }

        var confirmText = document.getElementById("confirmText");
        clearElement(confirmText);

        var question = document.createElement("div");
        question.className = "confirm-question";
        question.textContent = "本当に以下の登録をキャンセルしますか？";

        var summary = document.createElement("div");
        summary.className = "confirm-signup-summary";

        var name = document.createElement("span");
        name.className = "confirm-signup-name";
        name.textContent = currentCancelSignup.name;

        var details = document.createElement("span");
        details.className = "confirm-signup-details";
        details.textContent =
          currentCancelSignup.cls + " · " + currentCancelSignup.role;

        summary.appendChild(name);
        summary.appendChild(details);
        confirmText.appendChild(question);
        confirmText.appendChild(summary);

        var confirmBox = document.getElementById("confirmBox");
        confirmBox.style.display = "block";
        document.getElementById("cancelSubmitBtn").style.display = "none";
        if (confirmBox.scrollIntoView) {
          confirmBox.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "nearest",
          });
        }
      }

      function confirmCancel() {
        if (!currentCancelSignup) {
          showCancelMessage("キャンセルする登録を選んでください。", false);
          return;
        }

        var name = currentCancelSignup.name;
        var cls = currentCancelSignup.cls;
        var role = currentCancelSignup.role;
        var btn = document.getElementById("confirmYes");

        btn.disabled = true;
        btn.textContent = "キャンセル中...";
        document.getElementById("confirmNo").disabled = true;
        document.getElementById("cancelSubmitBtn").disabled = true;
        setCancelSignupListDisabled(true);

        google.script.run
          .withSuccessHandler(function (result) {
            if (result.success) {
              showCancelMessage(result.message, true);
              setTimeout(function () {
                if (EXEC_URL) {
                  window.top.location.href = EXEC_URL;
                } else {
                  // Fallback
                  window.top.location.reload();
                }
              }, 1500);
            } else {
              showCancelMessage(result.message, false);
              document.getElementById("confirmBox").style.display = "none";
              btn.disabled = false;
              btn.textContent = "はい、キャンセルします。";
              document.getElementById("confirmNo").disabled = false;
              setCancelSignupListDisabled(false);
              document.getElementById("cancelSubmitBtn").style.display =
                "block";
            }
          })
          .withFailureHandler(function (error) {
            showCancelMessage(
              "エラーが発生しました。再度試してください。",
              false,
            );
            document.getElementById("confirmBox").style.display = "none";
            btn.disabled = false;
            btn.textContent = "はい、キャンセルします。";
            document.getElementById("confirmNo").disabled = false;
            setCancelSignupListDisabled(false);
            document.getElementById("cancelSubmitBtn").style.display = "block";
          })
          .cancelSignup(currentEventId, name, cls, role, alias);
      }

      function showMessage(targetId, message, success) {
        var msgDiv = document.getElementById(targetId);
        var refreshPrompt = "ページをリフレッシュしてください。";
        msgDiv.textContent = "";
        msgDiv.className = "modal-message " + (success ? "success" : "error");

        if (success && message.indexOf(refreshPrompt) !== -1) {
          msgDiv.className += " action-needed";

          var mainText = message.replace(refreshPrompt, "").trim();
          if (mainText) {
            var mainSpan = document.createElement("span");
            mainSpan.className = "modal-message-main";
            mainSpan.textContent = mainText;
            msgDiv.appendChild(mainSpan);
          }

          var emphasisSpan = document.createElement("span");
          emphasisSpan.className = "modal-message-emphasis";
          emphasisSpan.textContent = refreshPrompt;
          msgDiv.appendChild(emphasisSpan);
        } else {
          msgDiv.textContent = message;
        }

        msgDiv.style.display = "block";
      }

      function showCancelMessage(message, success) {
        showMessage("cancelMessage", message, success);
      }

      function rebuildCurrentView() {
        buildMobileAgenda();
      }

      function shouldRefreshAfterSubmitRejection(result) {
        return result && result.code === "slot_full";
      }

      function refreshGridDataAfterSubmitRejection(eventId, message) {
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result || !result.success || !result.gridData) return;

            gridData = result.gridData;
            buildGridIndexes();
            rebuildCurrentView();

            if (
              currentEventId !== null &&
              String(currentEventId) === String(eventId) &&
              getEventById(eventId)
            ) {
              openModal(eventId);
              showModalMessage(message, false);
            }
          })
          .withFailureHandler(function () {})
          .getGridDataForAlias(alias);
      }

      function submitSignup() {
        // This is intentionally only a low-friction client-side filter. Real
        // abuse protection is enforced server-side via rate limiting.
        if (document.getElementById("honeypot").value !== "") return;
        // This is also only a client-side friction check. The backend rate
        // limiter remains the actual enforcement point.
        if (Date.now() - PAGE_LOAD_TIME < 3000) {
          showModalMessage("少し待ってから送信してください。", false);
          return;
        }
        if (!currentRole) {
          showModalMessage("登録したポジションを選択してください。", false);
          return;
        }

        var name = normaliseNameValue(document.getElementById("inputName").value);
        var cls = normaliseClassValue(document.getElementById("inputClass").value);
        var btn = document.getElementById("submitBtn");

        if (!name) {
          showModalMessage("名前を入力してください。", false);
          return;
        }
        if (name.length > 50) {
          showModalMessage("名前は５０文字以下で入力してください。", false);
          return;
        }
        if (!isValidNameValue(name)) {
          showModalMessage("名前に不正な文字が含まれています。", false);
          return;
        }
        if (!cls) {
          showModalMessage("クラスを入力してください。", false);
          return;
        }
        if (cls.length > 10) {
          showModalMessage("クラスは１０文字以下で入力してください。", false);
          return;
        }
        if (!/^[\p{L}\p{N}\s\-'.]+$/u.test(cls)) {
          showModalMessage("クラス名に不正な文字が含まれています。", false);
          return;
        }

        btn.disabled = true;
        btn.textContent = "送信中...";
        document.getElementById("modalMessage").style.display = "none";

        google.script.run
          .withSuccessHandler(function (result) {
            showModalMessage(result.message, result.success);
            if (result.success) {
              var event = getEventById(currentEventId);
              if (event) {
                var signup = {
                  name: result.name || name,
                  cls: result.cls || cls,
                  role: currentRole,
                };
                event.signups.push(signup);
                if (!event.signupsByRole[currentRole]) {
                  event.signupsByRole[currentRole] = [];
                }
                event.signupsByRole[currentRole].push(signup);
                var roleKey = ROLE_KEYS.find(function (r) {
                  return r.label === currentRole;
                });
                if (roleKey) event.slots[roleKey.key].filled++;
              }
              buildMobileAgenda();
              setTimeout(closeModal, 1500);
            } else {
              btn.disabled = false;
              btn.textContent = SIGNUP_BTN_TEXT;
              if (shouldRefreshAfterSubmitRejection(result)) {
                refreshGridDataAfterSubmitRejection(
                  currentEventId,
                  result.message,
                );
              }
            }
          })
          .withFailureHandler(function (error) {
            showModalMessage("問題が発生しました。再度試してください。", false);
            btn.disabled = false;
            btn.textContent = SIGNUP_BTN_TEXT;
          })
          .submitSignup(currentEventId, name, cls, currentRole, alias);
      }

      function showModalMessage(message, success) {
        showMessage("modalMessage", message, success);
      }

      document
        .getElementById("modalOverlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });
      document.getElementById("closeBtn").addEventListener("click", closeModal);
      document
        .getElementById("tabSignup")
        .addEventListener("click", function () {
          switchTab("signup");
        });
      document
        .getElementById("tabCancel")
        .addEventListener("click", function () {
          switchTab("cancel");
        });
      document
        .getElementById("cancelSubmitBtn")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          findAndConfirmCancel();
        });
      document
        .getElementById("cancelSignupList")
        .addEventListener("click", function (e) {
          var option =
            e.target && e.target.closest
              ? e.target.closest("[data-cancel-signup]")
              : null;
          var list = document.getElementById("cancelSignupList");
          if (!option || !list.contains(option) || option.disabled) return;
          selectCancelSignup(option.cancelSignupData, option);
        });
      document
        .getElementById("confirmYes")
        .addEventListener("click", function (e) {
          e.stopPropagation();
          confirmCancel();
        });
      document
        .getElementById("confirmNo")
        .addEventListener("click", function () {
          document.getElementById("confirmBox").style.display = "none";
          document.getElementById("cancelSubmitBtn").style.display = "block";
        });
      document
        .getElementById("submitBtn")
        .addEventListener("click", submitSignup);
      document
        .getElementById("inputName")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitSignup();
        });
      document
        .getElementById("inputClass")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitSignup();
        });

      document
        .getElementById("desktopScheduleStats")
        .addEventListener("click", function (e) {
          var button =
            e.target && e.target.closest
              ? e.target.closest("[data-desktop-insight]")
              : null;
          if (!button || !this.contains(button)) return;
          if (e.stopPropagation) e.stopPropagation();
          setDesktopInsightView(button.getAttribute("data-desktop-insight"));
        });
      document
        .getElementById("desktopInsightsPanel")
        .addEventListener("click", function (e) {
          var closeButton =
            e.target && e.target.closest
              ? e.target.closest("#desktopInsightsClose")
              : null;
          if (closeButton) {
            if (e.stopPropagation) e.stopPropagation();
            closeDesktopInsightsPanel(true);
            return;
          }

          var scopeButton =
            e.target && e.target.closest
              ? e.target.closest("[data-desktop-insight-scope]")
              : null;
          if (scopeButton) {
            if (e.stopPropagation) e.stopPropagation();
            setDesktopInsightScope(
              scopeButton.getAttribute("data-desktop-insight-scope"),
            );
            return;
          }

          var eventButton =
            e.target && e.target.closest
              ? e.target.closest("[data-insight-eventid]")
              : null;
          if (eventButton) {
            if (e.stopPropagation) e.stopPropagation();
            var eventId = eventButton.getAttribute("data-insight-eventid");
            closeDesktopInsightsPanel(false);
            openModal(eventId);
          }
        });
      document.addEventListener("click", function (e) {
        if (!activeDesktopInsightView) return;
        var target = e.target;
        var stats = document.getElementById("desktopScheduleStats");
        var panel = document.getElementById("desktopInsightsPanel");
        var insideStats = stats && target && stats.contains(target);
        var insidePanel = panel && target && panel.contains(target);
        if (!insideStats && !insidePanel) {
          closeDesktopInsightsPanel(false);
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && activeDesktopInsightView) {
          closeDesktopInsightsPanel(true);
        }
      });

      document
        .getElementById("mobileAgenda")
        .addEventListener("click", function (e) {
          var slot = e.target.closest("[data-eventid]");
          if (slot) {
            openModal(slot.getAttribute("data-eventid"));
          }
        });
      document
        .getElementById("mobileDisplayModeControl")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-display-mode]")
              : null;
          if (!btn) return;
          setMobileDisplayMode(btn.getAttribute("data-mobile-display-mode"));
        });
      document
        .getElementById("mobileTimeAvailabilityToggle")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          setMobileTimeFilterDropdownOpen(!mobileTimeFilterDropdownOpen);
        });
      document
        .getElementById("mobileTimeAvailabilityFilter")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-time-filter]")
              : null;
          if (!btn || btn.disabled) return;
          setMobileAvailableTimeFilter(btn.getAttribute("data-mobile-time-filter"));
        });
      document.addEventListener("click", function (e) {
        if (!mobileTimeFilterDropdownOpen) return;
        var target = e.target;
        var timeToggle = document.getElementById("mobileTimeAvailabilityToggle");
        var timeFilter = document.getElementById("mobileTimeAvailabilityFilter");
        var insideToggle =
          timeToggle &&
          target &&
          ((timeToggle.contains && timeToggle.contains(target)) ||
            (target.closest &&
              target.closest("#mobileTimeAvailabilityToggle")));
        var insideFilter =
          timeFilter &&
          target &&
          ((timeFilter.contains && timeFilter.contains(target)) ||
            (target.closest &&
              target.closest("#mobileTimeAvailabilityFilter")));
        if (!insideToggle && !insideFilter) {
          setMobileTimeFilterDropdownOpen(false);
        }
      });
      document
        .getElementById("mobileActivityFilter")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-activity-filter]")
              : null;
          if (!btn) return;
          setMobileActivityFilter(btn.getAttribute("data-mobile-activity-filter"));
        });
      document
        .getElementById("mobileRoleAvailabilityFilter")
        .addEventListener("click", function (e) {
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-mobile-role-filter]")
              : null;
          if (!btn) return;
          setMobileRoleFilter(btn.getAttribute("data-mobile-role-filter"));
        });
      document
        .getElementById("mobileKeywordSearch")
        .addEventListener("input", function (e) {
          setMobileKeywordSearchQuery(e.target.value);
        });
      document
        .getElementById("desktopActivityFilterToggle")
        .addEventListener("click", function () {
          setDesktopFilterPopoverOpen(
            desktopFilterPopoverOpen === "activity" ? "" : "activity",
          );
        });
      document
        .getElementById("desktopActivityFilterMenu")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-desktop-activity-filter]")
              : null;
          if (!btn) return;
          var activity = btn.getAttribute("data-desktop-activity-filter");
          setMobileActivityFilter(activity);
          focusDesktopChoiceOption(
            getDesktopActivityFilterMenu(),
            "data-desktop-activity-filter",
            activity,
          );
        });
      document
        .getElementById("desktopRoleFilterToggle")
        .addEventListener("click", function () {
          setDesktopFilterPopoverOpen(
            desktopFilterPopoverOpen === "role" ? "" : "role",
          );
        });
      document
        .getElementById("desktopRoleFilterMenu")
        .addEventListener("click", function (e) {
          if (e.stopPropagation) e.stopPropagation();
          var btn =
            e.target && e.target.closest
              ? e.target.closest("[data-desktop-role-filter]")
              : null;
          if (!btn) return;
          var roleKey = btn.getAttribute("data-desktop-role-filter");
          setMobileRoleFilter(roleKey);
          focusDesktopChoiceOption(
            getDesktopRoleFilterMenu(),
            "data-desktop-role-filter",
            roleKey,
          );
        });
      document
        .getElementById("desktopFilterReset")
        .addEventListener("click", resetScheduleFilters);
      document.addEventListener("click", function (e) {
        if (!desktopFilterPopoverOpen) return;
        var target = e.target;
        var toggle =
          desktopFilterPopoverOpen === "activity"
            ? getDesktopActivityFilterToggle()
            : getDesktopRoleFilterToggle();
        var menu =
          desktopFilterPopoverOpen === "activity"
            ? getDesktopActivityFilterMenu()
            : getDesktopRoleFilterMenu();
        var insideToggle = toggle && target && toggle.contains(target);
        var insideMenu = menu && target && menu.contains(target);
        if (!insideToggle && !insideMenu) {
          setDesktopFilterPopoverOpen("");
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape" || !desktopFilterPopoverOpen) return;
        var toggle =
          desktopFilterPopoverOpen === "activity"
            ? getDesktopActivityFilterToggle()
            : getDesktopRoleFilterToggle();
        setDesktopFilterPopoverOpen("");
        if (toggle && toggle.focus) toggle.focus();
      });

      document.getElementById("pageTitle").textContent = PAGE_TITLE;
      updateMobileDisplayModeControl();
      updateMobileAvailabilityControl();

      google.script.run
        .withSuccessHandler(function (url) {
          EXEC_URL =
            url +
            (url.indexOf("?") === -1 ? "?" : "&") +
            "event=" +
            encodeURIComponent(alias);
        })
        .getDeployedUrl();

      buildGridIndexes();
      renderResponsiveView();
      buildMobileAgenda();
      window.addEventListener("resize", function () {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(function () {
          renderResponsiveView();
        }, 120);
      });
    </script>

    <div
      style="margin-top: 2rem; font-size: 12px; color: #888; text-align: center"
    >
      <a
        href="https://github.com/endotaatodne/signup_app"
        target="_blank"
        rel="noopener noreferrer"
        style="color: #888"
        >このアプリについて</a
      >
    </div>
  </body>
</html>
